<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S5 戰略地圖</title>
<link rel="icon" type="image/png" href="strategic_map_icon.png"><link rel="apple-touch-icon" href="strategic_map_icon.png">
<style>
:root{
  --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#323843; --text:#e6e8ec; --muted:#9aa3b2;
  --accent:#e0b866; --shu:#4fb37a; --wei:#5b8fd9; --neutral:#b08a4a; --gate:#3fd0d0; --gate3:#ff7a59;
  --tunnel:#ffd34d; --oneway:#c58cff; --locked:#6b7280; --black:#e8590c; --buff:#e0b866; --jungle:#dc2626; --jelite:#9333ea;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 360px;height:100vh}
#mapWrap{position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;background:#0f1114}
#mapWrap.drag{cursor:grabbing}
#mapWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(20,22,26,.94);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;max-width:340px;display:none;white-space:pre-line;z-index:5}
#hud{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;background:rgba(20,22,26,.7);padding:3px 8px;border-radius:4px;pointer-events:none}
#legend{position:absolute;left:12px;top:12px;max-width:215px;background:rgba(20,22,26,.82);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;z-index:4}
#legend label{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer;user-select:none}
#legend .sec{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted)}
#legend select{font-size:12px;padding:2px 4px;margin-top:3px;width:100%}
#legend button{width:100%;margin-top:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
#zoomCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:4}
#zoomCtl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:rgba(28,31,37,.92);color:var(--text);font:600 18px/1 sans-serif;cursor:pointer}
#zoomCtl button:hover{border-color:var(--accent)}
#zoomCtl button.small{font-size:12px;width:auto;padding:0 4px}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);background:rgba(15,17,20,.7);z-index:6}
#busy a{color:var(--accent)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ctrl{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ctrl h1{font-size:16px;margin:0;color:var(--accent);display:flex;align-items:center;gap:8px}
.ctrl h1 span{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > label{color:var(--muted);font-size:12px;min-width:56px}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
#timeLabel{font-weight:600;color:var(--accent);min-width:150px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#list{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:12px}
tr.click{cursor:pointer}
tr.click:hover{background:var(--panel2)}
tr.sel{background:#2b2f38}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.lock{color:var(--locked)}
.open{color:#7ee2a0}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;background:var(--panel2);border:1px solid var(--line);margin-right:3px}
.note{color:var(--muted);font-size:12px;padding:8px 12px}
.bdg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:middle;border:1px solid rgba(0,0,0,.6)}
.bkey{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px}
.bkey span{white-space:nowrap}
/* 地形設定彈出視窗 */
#setBack{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#setBack.on{display:flex}
#setDlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#setDlg header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
#setDlg header h2{flex:1;margin:0;font-size:15px;color:var(--accent)}
#setDlg header button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
#setDlg section{padding:10px 14px;border-bottom:1px solid var(--line)}
#setDlg section:last-child{border-bottom:0}
#setDlg h3{font-size:12px;margin:0 0 6px;color:var(--muted);font-weight:500}
#setDlg label.l{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer;user-select:none;font-size:13px}
#setDlg .sw{width:13px;height:13px;border:1px solid rgba(255,255,255,.15)}
.num{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
#perf{font:12px/1.6 ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#perf b{color:var(--accent);font-weight:600}
#legendHead{display:none}
/* 行動版：地圖在上方、側欄改為整頁捲動（列表完整展開），圖層開關可折疊 */
@media (max-width:820px){
  html,body{height:auto}
  #app{display:block;height:auto}
  #mapWrap{height:62vh;height:62dvh;border-bottom:1px solid var(--line)}
  aside{border-left:0;display:block}
  .ctrl{padding:10px 12px;gap:6px}
  .ctrl h1{font-size:15px}
  select,input{font-size:16px}
  .row > label{min-width:52px}
  #timeLabel{min-width:0;flex:1}
  input[type=range]{height:28px}
  .btn{padding:6px 10px;font-size:13px}
  .tabs{position:sticky;top:0;z-index:8;background:var(--panel);overflow-x:auto}
  .tabs button{padding:11px 0;min-width:52px}
  #list{overflow:visible}
  th{top:43px;z-index:7}
  th,td{padding:8px}
  table{font-size:14px}
  #legend{left:8px;top:8px;max-width:190px;max-height:calc(100% - 16px);overflow:auto;padding:6px 8px}
  #legend #legendHead{display:flex;align-items:center;gap:6px;width:100%;margin:0;padding:2px 0;background:none;border:0;color:var(--text);font:600 13px/1.4 inherit;cursor:pointer}
  #legendHead .car{margin-left:auto;color:var(--muted);transition:transform .15s}
  #legend.fold #legendBody{display:none}
  #legend.fold .car{transform:rotate(-90deg)}
  #legend:not(.fold) #legendHead{margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  #legend label{margin:4px 0;font-size:13px}
  #zoomCtl{right:8px;bottom:8px}
  #zoomCtl button{width:40px;height:40px}
  #tip{max-width:min(300px,calc(100% - 16px));font-size:12px}
  #hud{left:8px;bottom:8px;font-size:11px}
}

/* ---------- 宣戰規劃 ---------- */
.war{padding:10px 12px;display:grid;gap:12px;font-size:13px}
.war section{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:rgba(255,255,255,.015)}
.war h3{margin:0 0 6px;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:6px}
.war h3 .sp{flex:1}
.war .wr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.war .wr > span.k{color:var(--muted);font-size:12px;min-width:64px}
.war input[type=number]{width:64px}
.war input.hms{width:46px;text-align:center}
.war .live{color:var(--muted);font-size:12px;line-height:1.6}
.war .live b{color:var(--text)}
.war .chips{display:flex;flex-wrap:wrap;gap:4px}
.war .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:1px 4px 1px 8px;font-size:12px;cursor:pointer}
.war .chip.start{border-color:#4fb37a}
.war .chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 3px;line-height:1}
.war .chip button:hover{color:#ff7a7a}
.war .pick.on{border-color:var(--accent);background:#3a3222;color:var(--accent)}
.war .empty{color:var(--muted);font-size:12px}
.war .tgt{border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin:6px 0;background:var(--panel)}
.war .tgt.bad{border-color:#a8433f}
.war .tgt.warn{border-color:#8a6d2a}
.war .tgt .hd{display:flex;align-items:center;gap:6px}
.war .tgt .no{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#c0392b;color:#fff;font-size:11px;font-weight:700;padding:0 4px}
.war .tgt.ok .no{background:#b98a2c}
.war .tgt .nm{flex:1;cursor:pointer;font-weight:600}
.war .tgt .nm span{font-weight:400;color:var(--muted);font-size:12px}
.war .tgt .ops button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;width:26px;height:24px;cursor:pointer;padding:0}
.war .tgt .ops button:disabled{opacity:.35;cursor:default}
.war .tgt .ops button:hover:not(:disabled){border-color:var(--accent)}
.war .tgt input[type=datetime-local]{flex:1;min-width:0}
.war .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.war .b{font-size:11px;border-radius:3px;padding:1px 6px;border:1px solid}
.war .b.ok{color:#7ee2a0;border-color:#2f6b45}
.war .b.bad{color:#ff8a80;border-color:#7a3530}
.war .b.warn{color:#f2c46d;border-color:#7a6230}
.war .b.mu{color:var(--muted);border-color:var(--line)}
.war .b button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 4px;font:inherit}
.war .add{display:flex;gap:6px}
.war .add input{flex:1;min-width:0}
.war .note{padding:4px 0 0}
#warPick{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(58,50,34,.95);border:1px solid var(--accent);color:var(--accent);border-radius:16px;padding:4px 6px 4px 12px;font-size:12px;z-index:6;display:none;align-items:center;gap:8px;white-space:nowrap}
#warPick.on{display:flex}
#warImgBack{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#warImgBack.on{display:flex}
#warImgDlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(860px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#warImgDlg header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#warImgDlg header h2{flex:1;margin:0;font-size:15px;color:var(--accent);min-width:120px}
#warImgDlg .body{overflow:auto;padding:10px;background:#0f1114}
#warImgDlg img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:6px}
#warImgClose{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
#warPick button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:2px 10px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="legend"></div>
    <div id="busy">載入地形紋理中…</div>
    <div id="tip"></div>
    <div id="warPick"><span id="warPickTxt"></span><button id="warPickEnd">完成</button></div>
    <div id="hud"></div>
    <div id="zoomCtl">
      <button id="zIn" title="放大（+）">＋</button>
      <button id="zOut" title="縮小（-）">－</button>
      <button id="zFit" class="small" title="全圖（0 / 雙擊）">全圖</button>
    </div>
  </div>
  <aside>
    <div class="ctrl">
      <h1><span id="title"></span><button class="btn" id="openSet" title="地形設定">⚙ 地形</button></h1>
      <div class="row"><label>伺服器組</label><select id="grp"></select></div>
      <div class="row"><label>開服日期</label><input type="date" id="openDate"><span class="note" style="padding:0">（UTC+8）</span><button id="toNow" class="btn" title="時間點移到現在">現在</button></div>
      <div class="row"><label>設定檔</label><select id="srvRec" style="flex:1;min-width:0" title="切換設定檔（含伺服器組、開服日期與宣戰規劃）"></select><button id="recSave" class="btn" title="將目前的伺服器組、開服日期與宣戰規劃另存為設定檔">另存</button><button id="recDel" class="btn" title="刪除選用中的設定檔">刪除</button></div>
      <div class="row"><label>時間點</label><input type="range" id="t" min="0" step="1"></div>
      <div class="row"><span id="timeLabel"></span><label style="min-width:0"><input type="checkbox" id="allOpen"> 全部視為開放</label></div>
      <div class="row"><input id="q" placeholder="搜尋名稱 / 州郡 / 等級（如 Lv10、8-10、8+）" style="flex:1"></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-k="state" class="on">州郡</button><button data-k="gate">關口</button><button data-k="tunnel">地道</button><button data-k="city">城池</button><button data-k="black">黑山</button><button data-k="jungle">四境</button><button data-k="war">宣戰</button>
    </div>
    <div id="list"></div>
  </aside>
</div>

<div id="setBack">
  <div id="setDlg" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <header><h2 id="setTitle">地形設定</h2><button id="closeSet" title="關閉（Esc）">×</button></header>
    <section><h3>效能</h3><div id="perf">初始化中…</div></section>
    <section><h3>地形（勾選顯示；⛔ = 阻擋）</h3><div id="classList"></div></section>
    <section>
      <h3>顯示</h3>
      <label class="l"><input type="checkbox" id="lOutline"><span class="sw" style="background:#000"></span>合併阻擋區外框</label>
      <label class="l" style="gap:10px">州郡著色濃度<input type="range" id="stateAlpha" min="0" max="100" value="45" style="flex:1"></label>
      <label class="l" style="gap:10px">地形亮度<input type="range" id="terrBright" min="40" max="140" value="100" style="flex:1"></label>
    </section>
    <section>
      <h3>說明</h3>
      <div class="note" id="statNote" style="padding:0"></div>
      <div class="note" style="padding:6px 0 0">顏色 → 地形對應由地圖資料推得（城池、關口、橋座標皆落在對應顏色）；大型阻擋區已合併碎塊並保留關口與橋樑開口；行軍路線仍以伺服器為準。
        Canvas 2D 版地形頁：<a href="terrain_s5.html" style="color:var(--accent)">terrain_s5.html</a></div>
    </section>
  </div>
</div>

<div id="warImgBack"><div id="warImgDlg" role="dialog" aria-modal="true" aria-labelledby="warImgTitle"><header><h2 id="warImgTitle">攻城順序圖片</h2><button class="btn" id="warImgDl">下載</button><button class="btn" id="warImgCopy">複製圖片</button><label class="btn" style="display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="warImgTok" style="margin:0">顯示宣戰令</label><button id="warImgClose" title="關閉（Esc）">×</button></header><div class="body"><img id="warImg" alt="攻城順序表"></div></div></div>

const $ = s => document.querySelector(s);
const wrap = $('#mapWrap'), glc = $('#gl'), ov = $('#ov'), ctx = ov.getContext('2d'), tip = $('#tip');
const N = D.N, OUT = D.outline;
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();

// ---------- 座標（頁面座標以「格」為單位：u = gx、v = N-1-gz） ----------
const toPx = (gx, gz) => [gx + 0.5, N - 1 - gz + 0.5];
const toGrid = (u, v) => [Math.floor(u), N - 1 - Math.floor(v)];
// 標記大小 / 標籤門檻沿用戰略地圖（以 152px 小地圖為座標）的手感：換算成相同的縮放等級
const ZK = N / 152;
const zq = () => view.s * ZK;

// ---------- 州郡 ----------
const stateById = Object.fromEntries(D.states.map(s => [s.id, s]));
const neutralPalette = ['#b08a4a', '#9a7bb8', '#c9a35a', '#7aa6a0', '#b87b6a', '#8b9a5b'];
function stateColor(id) {
  const s = stateById[id];
  if (!s) return null;
  if (s.side === 101) return C('--shu');
  if (s.side === 102) return C('--wei');
  return neutralPalette[id % neutralPalette.length];
}
const stateCenter = D.stateCenter;

// ---------- 時間 ----------
const grpSel = $('#grp');
Object.entries(D.serverGroups).forEach(([k, v]) => grpSel.add(new Option(`${k}　${v}`, k)));
grpSel.value = D.gates[0]?.unlock?.['8'] !== undefined || D.cities[0]?.unlock?.['8'] !== undefined ? '8' : Object.keys(D.serverGroups)[0];
const cityUnlock = c => { const d = c.unlock[grpSel.value]; return d == null ? null : [d, D.cityUnlockHour]; };
const gateUnlock = g => g.unlock[grpSel.value] || null;
const hoursOf = u => u ? (u[0] - 1) * 24 + u[1] : 0;
function maxHours() {
  let m = 24;
  D.cities.forEach(c => m = Math.max(m, hoursOf(cityUnlock(c)) + 24));
  D.gates.forEach(g => m = Math.max(m, hoursOf(gateUnlock(g)) + 24));
  return m;
}
const slider = $('#t');
function resetSlider() { slider.max = maxHours(); }
const isOpen = u => $('#allOpen').checked || !u || hoursOf(u) <= +slider.value;
function fmtUnlock(u) {
  if (!u) return '—';
  const base = `第 ${u[0]} 天 ${String(u[1]).padStart(2, '0')}:00`;
  const od = $('#openDate').value;
  if (!od) return base;
  const d = new Date(od + 'T00:00:00+08:00');
  d.setTime(d.getTime() + ((u[0] - 1) * 24 + u[1]) * 3600e3);
  const p = n => String(n).padStart(2, '0');
  const t = new Date(d.getTime() + 8 * 3600e3);
  return `${base}（${t.getUTCMonth() + 1}/${p(t.getUTCDate())} ${p(t.getUTCHours())}:00）`;
}
function timeLabel() {
  if ($('#allOpen').checked) return '全部開放';
  const h = +slider.value, day = Math.floor(h / 24) + 1, hr = h % 24;
  return fmtUnlock([day, hr]);
}

// ---------- 圖層（左上圖例，與戰略地圖相同） ----------
// 城池增益圖示：代號 → [名稱, 顏色]
const BUFF_META = {
  res: ['資源', '#7ee2a0'], drill: ['徵兵', '#f59e0b'], pub: ['酒肆', '#e0b866'], trade: ['交易', '#93c5fd'],
  area: ['出生州', '#ef4444'], pvp: ['攻防', '#f472b6'], oneway: ['戍烽隘', '#c58cff'], top: ['犒賞', '#fde047'],
};
const usedBuffs = [...new Set(D.cities.flatMap(c => c.buffs.map(b => b.k)))];
const layers = {
  state: ['州郡著色', true, '#5b8fd9'], cityLink: ['城池 / 關口連線', true, '#8d97a8'], city: ['城池', true, '#e9d9b0'],
  gate: ['關口', true, C('--gate')], tunnel: ['地道', true, C('--tunnel')], oneway: ['戍烽隘', true, C('--oneway')],
  black: ['黑山軍', true, C('--black')], buff: ['城池增益', true, C('--buff')],
  jungle: ['肅清四境', true, C('--jungle')],
};
if (!D.jungle.camps.length) delete layers.jungle;
$('#legend').innerHTML = `<button id="legendHead" type="button">圖層顯示<span class="car">▾</span></button><div id="legendBody">` +
  Object.entries(layers).map(([k, [n, on, col]]) =>
  `<label><input type="checkbox" data-l="${k}" ${on ? 'checked' : ''}><span class="sw" style="background:${col}"></span>${n}</label>`).join('') +
  `<div class="sec">增益圖示<div class="bkey">${usedBuffs.map(k => `<span><span class="bdg" style="background:${BUFF_META[k][1]}"></span>${BUFF_META[k][0]}</span>`).join('')}</div></div>` +
  `<div class="sec">地道連線<select id="tMode"><option value="all">預設全部顯示</option><option value="click">點擊地道才顯示</option></select></div>` +

// ==================== 宣戰規劃 ====================
// 時間一律以 UTC+8 解讀；宣戰令以絕對時間（毫秒）保存，重開頁面時依經過時間推算目前數量
var WAR = null, warPickMode = null, warTimer = 0;
const WAR_APP = 'sgqx-map-warplan';
const PAGE_KEY = location.pathname || '/';
const WAR_KEY = 'map.warPlan@' + PAGE_KEY;
const WT = { cost: 1, cap: 3, interval: 24 * 3600 };
const warRedraw = () => (typeof drawOverlay === 'function' ? drawOverlay() : draw());
const p2 = n => String(n).padStart(2, '0');
const toLocal8 = ms => new Date(ms + 8 * 3600e3).toISOString().slice(0, 16);           // → datetime-local 值（UTC+8）
const fromLocal8 = v => v ? new Date(v + ':00+08:00').getTime() : null;
const fmt8 = ms => { const d = new Date(ms + 8 * 3600e3); return `${d.getUTCMonth() + 1}/${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const fmtDur = s => { s = Math.max(0, Math.round(s)); return `${p2(Math.floor(s / 3600))}:${p2(Math.floor(s % 3600 / 60))}:${p2(s % 60)}`; };
const nodeName = id => nodeById(id)?.name ?? `#${id}`;
const nodeKind = id => cityById[id] ? 'city' : gateById[id] ? 'gate' : null;

function warDefault() {
  return { tok: { n: WT.cap, at: Date.now(), next: null, interval: WT.interval, cap: WT.cap, cost: WT.cost }, start: null, owned: [], targets: [] };
}
function warLoad() {
  try { const o = JSON.parse(store.get(WAR_KEY, 'null')); if (o && o.tok) return warSanitize(o).plan; } catch {}
  return warDefault();
}
const warPlain = () => { const { _res, ...o } = WAR; return o; };
function warSave() { store.set(WAR_KEY, JSON.stringify(warPlain())); if (typeof profileSync === 'function') profileSync(); }

// 宣戰令模擬器：from 時點的狀態往後推進（未滿上限時每 interval 秒 +1；滿上限時停止計時，消耗後重新起算）
function tokSim(tok) {
  const iv = Math.max(60, +tok.interval || 3600) * 1000, cap = Math.max(1, +tok.cap || 1);
  let n = Math.min(+tok.n || 0, cap), nextAt = n >= cap ? null : (tok.next ?? tok.at + iv);
  const S = {
    get n() { return n; }, get nextAt() { return nextAt; }, cap, iv,
    advance(t) {
      while (nextAt != null && nextAt <= t) { n++; if (n >= cap) { n = cap; nextAt = null; } else nextAt += iv; }
    },
    consume(t, c) { const full = n >= cap; n -= c; if (full && n < cap) nextAt = t + iv; },
    // 從 t 起最早累積到 c 枚的時間
    earliest(t, c) {
      if (n >= c) return t;
      let k = n, at = nextAt; if (at == null) return null;
      while (k < c) { k++; if (k < c) at += iv; }
      return Math.max(t, at);
    },
  };
  return S;
}
function tokNow() { const S = tokSim(WAR.tok); S.advance(Date.now()); return S; }

// 檢查計畫：連接（依清單順序，前面的目標視為已攻下）、宣戰令（依時間順序）、開放時間
function warCheck() {
  const T = WAR.targets, res = T.map(() => ({ issues: [], warns: [], info: [] }));
  const have = new Set([WAR.start, ...WAR.owned].filter(v => v != null));
  const od = $('#openDate').value;
  let prevTime = -Infinity;
  T.forEach((t, i) => {
    const r = res[i], o = nodeById(t.id);
    if (!o) { r.issues.push('目前地圖無此地點'); return; }
    if (have.has(t.id)) r.warns.push('已在已有清單 / 前面的目標中');
    // 連接
    if (!have.size) r.issues.push('未設定起點或已有城池');
    else {
      const via = (linksOf[t.id] || []).filter(id => have.has(id));
      if (via.length) r.conn = via; else r.issues.push('未與已有城池相連');
    }
    have.add(t.id);
    // 開放時間
    const u = nodeKind(t.id) === 'city' ? cityUnlock(o) : gateUnlock(o);
    if (u && od) {
      const openMs = warOpenMs(t.id);
      r.openMs = openMs;
      if (t.time != null && t.time < openMs) r.issues.push(`尚未開放（${fmt8(openMs)} 開放）`);
    } else if (u && !od) r.openDay = u;
    // 時間順序
    if (t.time == null) r.warns.push('未設定宣戰時間');
    else {
      if (t.time < prevTime) r.warns.push('時間早於上一個目標');
      prevTime = Math.max(prevTime, t.time);
    }
  });
  // 宣戰令：依時間先後消耗；不足的目標假設延到「最早可宣戰時間」才宣戰並扣除，後面的目標依序往後推
  const S = tokSim(WAR.tok), now = Date.now();
  const order = T.map((t, i) => i).filter(i => T[i].time != null && nodeById(T[i].id)).sort((a, b) => T[a].time - T[b].time);
  let vt = -Infinity;   // 前一個被延後的目標實際宣戰時間
  for (const i of order) {
    const t = T[i], r = res[i], c = +WAR.tok.cost || 1;
    if (t.time < WAR.tok.at) { r.warns.push('時間早於宣戰令設定時間'); }
    S.advance(t.time);
    if (S.n >= c && t.time >= vt) { S.consume(t.time, c); r.tokLeft = S.n; }
    else {
      const have = S.n, e = S.earliest(Math.max(t.time, vt), c);
      r.tokShort = true; r.tokHave = have; r.earliest = e;
      r.issues.push(`宣戰令不足（${have}/${c}）`);
      if (e != null) { S.advance(e); S.consume(e, c); vt = e; }
    }
    if (t.time < now) r.warns.push('時間已過');
  }
  return res;
}

// 地圖標示：起點（綠色雙圈）、已有（綠圈）、目標（依順序編號，紅 = 有問題）
function drawWar() {
  if (!WAR || (!WAR.start && !WAR.owned.length && !WAR.targets.length)) return;
  const res = WAR._res || [];
  const at = id => { const o = nodeById(id); return o ? scr(...toPx(o.x, o.z)) : null; };
  ctx.save();
  for (const id of WAR.owned) {
    const p = at(id); if (!p) continue;
    ctx.strokeStyle = '#4fb37a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, 7); ctx.stroke();
  }
  if (WAR.start != null) {
    const p = at(WAR.start);
    if (p) {
      ctx.strokeStyle = '#4fb37a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(p[0], p[1], 15, 0, 7); ctx.stroke();
    }
  }
  // 連接路線（目標 ← 相連的已有地點）
  WAR.targets.forEach((t, i) => {
    const p = at(t.id), via = res[i]?.conn; if (!p || !via) return;
    const q = at(via[0]); if (!q) return;
    ctx.strokeStyle = 'rgba(224,184,102,.75)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.setLineDash([]);
  });
  // 目標名稱牌：順序編號與名稱放在同一個醒目的標籤內（取代一般名稱，不互相遮擋），任何縮放都顯示
  WAR.targets.forEach((t, i) => {
    const p = at(t.id), o = nodeById(t.id); if (!p || !o) return;
    const bad = res[i]?.issues?.length, col = bad ? '#e74c3c' : '#e0b866';
    const txt = `${o.name}${o.lv != null ? ' Lv' + o.lv : ''}`;
    ctx.font = '700 13px sans-serif';
    const tw = ctx.measureText(txt).width, R = 9, padL = 3, gap = 5, padR = 8;
    const w = padL + R * 2 + gap + tw + padR, h = 22;
    const x0 = p[0] - w / 2, y0 = p[1] - 14 - h;   // 點位正上方
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y0, w, h, h / 2) : ctx.rect(x0, y0, w, h);
    ctx.fillStyle = 'rgba(20,22,26,.92)'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
    // 指向點位的小三角
    ctx.beginPath(); ctx.moveTo(p[0] - 5, y0 + h); ctx.lineTo(p[0] + 5, y0 + h); ctx.lineTo(p[0], y0 + h + 6); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    const cx = x0 + padL + R, cy = y0 + h / 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = bad ? '#c0392b' : '#b98a2c'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), cx, cy + .5);
    ctx.font = '700 13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = bad ? '#ffb3aa' : '#ffe8a3';
    ctx.fillText(txt, cx + R + gap, cy + .5);
    hits.push({ x: p[0], y: cy, r: 0, box: [x0, y0, x0 + w, y0 + h], kind: nodeKind(t.id), o });
  });
  ctx.restore();
}

function warIsTarget(id) { return !!WAR && WAR.targets.some(t => t.id === id); }

function warTap(h) {

  if (!h || (h.kind !== 'city' && h.kind !== 'gate')) return true;   // 點選模式下忽略其他物件

// 地點開放時間（毫秒，UTC+8）；未設開服日期或無開放設定時為 null
function warOpenMs(id) {

  navigator.clipboard.write([new ClipboardItem({ 'image/png': warImgBlob })]).then(() => alert('已複製圖片，可直接貼到聊天軟體'), e => alert('複製失敗：' + e.message));
});
$('#warImgTok').addEventListener('change', e => { warImgShowTok = e.target.checked; store.set('map.warImgTok', warImgShowTok ? '1' : '0'); warShowImage(); });
WAR = warLoad();
WAR._res = warCheck();
setTimeout(warFromQuery, 0);   // 等頁面初始化（開服設定還原等）完成後再處理分享連結

$('#title').textContent = document.title;
// 設定檔：每個設定檔包含伺服器組、開服日期與宣戰規劃，依頁面網址分開保存
// 目前畫面上的狀態另存在 lastGrp / lastDate / warPlan（未選設定檔時也會保留）；選用中的設定檔會隨變更自動更新
const PATH_SUFFIX = '@' + (location.pathname || '/');
const PROF_KEY = 'map.profiles' + PATH_SUFFIX, CUR_KEY = 'map.profileCur' + PATH_SUFFIX;
const LAST_SUFFIX = PATH_SUFFIX;
const ANON_NAME = '匿名設定檔（分享連結）';
const loadProfiles = () => { try { const a = JSON.parse(store.get(PROF_KEY, '[]')); return Array.isArray(a) ? a : []; } catch { return []; } };
const saveProfiles = a => store.set(PROF_KEY, JSON.stringify(a));
// 舊版「開服紀錄」（只有組別與日期）轉成設定檔
if (store.get(PROF_KEY, null) == null) {
  let old = [];
  try { old = JSON.parse(store.get('map.srvRecords' + PATH_SUFFIX, null) ?? store.get('map.srvRecords', '[]')) || []; } catch {}
  saveProfiles(old.filter(r => r && r.name).map(r => ({ name: r.name, grp: r.grp, date: r.date || '' })));
}
let profCur = store.get(CUR_KEY, '') || '';
const recSel = $('#srvRec');
function renderRecs() {
  const list = loadProfiles();
  if (profCur && !list.some(p => p.name === profCur)) profCur = '';
  recSel.innerHTML = '';
  recSel.add(new Option(list.length ? '（未存成設定檔的目前設定）' : '（尚無設定檔）', ''));
  list.forEach(p => recSel.add(new Option(`${p.name}　${p.date || '未填開服日期'}${p.war?.targets?.length ? `・${p.war.targets.length} 目標` : ''}`, p.name)));
  recSel.value = profCur;
  $('#recDel').disabled = !profCur;
}
// 目前狀態寫回選用中的設定檔
function profileSync() {
  if (!profCur) return;
  const list = loadProfiles(), p = list.find(p => p.name === profCur); if (!p) return;
  p.grp = grpSel.value; p.date = $('#openDate').value || '';
  if (WAR) p.war = warPlain();
  saveProfiles(list);
}
const rememberLast = () => { store.set('map.lastGrp' + LAST_SUFFIX, grpSel.value); store.set('map.lastDate' + LAST_SUFFIX, $('#openDate').value); profileSync(); };
// 套用設定檔（save = 新增 / 覆蓋同名設定檔後再套用）
function profileApply(p, save = false) {
  if (save) {
    const list = loadProfiles(), i = list.findIndex(x => x.name === p.name);
    const rec = { name: p.name, grp: p.grp, date: p.date || '', war: p.war, ...(p.anon ? { anon: true } : {}) };
    if (i >= 0) list[i] = rec; else list.push(rec);
    saveProfiles(list);
  }
  profCur = p.name; store.set(CUR_KEY, profCur);
  if (p.grp != null && D.serverGroups[p.grp] !== undefined) grpSel.value = p.grp;
  $('#openDate').value = p.date || '';
  WAR = p.war ? warSanitize(p.war).plan : warDefault();
  warTokEdit = false; warTokDraft = null;
  store.set('map.lastGrp' + LAST_SUFFIX, grpSel.value); store.set('map.lastDate' + LAST_SUFFIX, $('#openDate').value);
  store.set(WAR_KEY, JSON.stringify(warPlain()));
  renderRecs(); resetSlider(); autoNow();
  WAR._res = warCheck(); refresh();
}
recSel.addEventListener('change', () => {
  if (recSel.value === '') { profCur = ''; store.set(CUR_KEY, ''); renderRecs(); return; }
  const p = loadProfiles().find(p => p.name === recSel.value);
  if (p) profileApply(p);
});
$('#recSave').addEventListener('click', () => {
  const date = $('#openDate').value, grp = grpSel.value;
  const def = profCur && profCur !== ANON_NAME ? profCur : `${D.serverGroups[grp] || grp}${date ? ' ' + date : ''}`;
  const name = (prompt('設定檔名稱（同名會覆蓋）', def) || '').trim();
  if (!name) return;
  profileApply({ name, grp, date, war: warPlain() }, true);
});
$('#recDel').addEventListener('click', () => {
  if (!profCur || !confirm(`刪除設定檔「${profCur}」？（目前畫面上的設定會保留）`)) return;
  saveProfiles(loadProfiles().filter(p => p.name !== profCur));
  profCur = ''; store.set(CUR_KEY, ''); renderRecs();
});
// 時間點移到現在（需先填開服日期）
// 現在時間距開服的小時數；無開服日期時為 null
function hoursNow() {
  const od = $('#openDate').value; if (!od) return null;
  return Math.floor((Date.now() - new Date(od + 'T00:00:00+08:00').getTime()) / 3600e3);
}
function sliderNow() {
  const h = hoursNow(); if (h == null) return false;
  slider.value = Math.max(0, Math.min(+slider.max, h)); return true;
}
// 目前時間落在「開服 ~ 最後一個地點開放」之間時，時間點自動移到現在
function autoNow() {
  const h = hoursNow();
  if (h == null || h < 0 || h > +slider.max) return false;
  slider.value = h; $('#allOpen').checked = false; return true;
}
$('#toNow').addEventListener('click', () => { if (!sliderNow()) { alert('請先填寫開服日期'); return; } $('#allOpen').checked = false; refresh(); });
$('#openDate').addEventListener('change', () => { rememberLast(); if (autoNow()) refresh(); });
grpSel.addEventListener('change', () => { rememberLast(); if (autoNow()) refresh(); });
{ const g = store.get('map.lastGrp' + LAST_SUFFIX, null) ?? store.get('map.lastGrp', null); if (g != null && D.serverGroups[g] !== undefined) grpSel.value = g; }
$('#openDate').value = store.get('map.lastDate' + LAST_SUFFIX, null) ?? store.get('map.lastDate', '') ?? '';
renderRecs();
resetSlider(); slider.value = slider.max;
autoNow();   // 開服期間內預設顯示目前時間點
renderList();
addEventListener('resize', resize);
new ResizeObserver(resize).observe(wrap);
if (gl) {
  glc.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; fail('GPU 內容遺失（可能是記憶體不足）。'); });
  try {
    initGL();
    resize();
    const td = performance.now(), img = new Image();
    img.onload = () => {
      perf.decode = performance.now() - td;
      uploadData(img);
      ready = true;
      updatePalette();
      perf.init = performance.now() - t0;
      showPerf();
      $('#busy').remove();
      render();
    };
    img.onerror = () => fail('地形圖載入失敗：' + D.img);
    img.src = D.img;
  } catch (err) { fail('WebGL 初始化失敗：' + err.message); }
}
</script>
</body>
</html>
