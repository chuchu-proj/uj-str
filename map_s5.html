<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S5 戰略地圖</title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#323843; --text:#e6e8ec; --muted:#9aa3b2;
  --accent:#e0b866; --shu:#4fb37a; --wei:#5b8fd9; --neutral:#b08a4a; --gate:#3fd0d0; --gate3:#ff7a59;
  --tunnel:#ffd34d; --oneway:#c58cff; --locked:#6b7280; --black:#e8590c; --buff:#e0b866; --jungle:#dc2626; --jelite:#9333ea;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 360px;height:100vh}
#mapWrap{position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
#mapWrap.drag{cursor:grabbing}
#zoomCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:4}
#zoomCtl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:rgba(28,31,37,.92);color:var(--text);font:600 18px/1 sans-serif;cursor:pointer}
#zoomCtl button:hover{border-color:var(--accent)}
#zoomCtl button.small{font-size:12px;width:auto;padding:0 4px}
#legend .sec{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted)}
#legend select{font-size:12px;padding:2px 4px;margin-top:3px;width:100%}
tr.sel{background:#2b2f38}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
canvas{display:block;width:100%;height:100%}
#tip{position:absolute;pointer-events:none;background:rgba(20,22,26,.94);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;max-width:340px;display:none;white-space:pre-line;z-index:5}
#hud{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;background:rgba(20,22,26,.7);padding:3px 8px;border-radius:4px}
#legend{position:absolute;left:12px;top:12px;max-width:215px;background:rgba(20,22,26,.82);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
#legend label{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer;user-select:none}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ctrl{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ctrl h1{font-size:16px;margin:0;color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > label{color:var(--muted);font-size:12px;min-width:56px}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
#timeLabel{font-weight:600;color:var(--accent);min-width:150px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#list{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:12px}
tr.click{cursor:pointer}
tr.click:hover{background:var(--panel2)}
.lock{color:var(--locked)}
.open{color:#7ee2a0}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;background:var(--panel2);border:1px solid var(--line);margin-right:3px}
.note{color:var(--muted);font-size:12px;padding:8px 12px}
.bdg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:middle;border:1px solid rgba(0,0,0,.6)}
.bkey{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px}
.bkey span{white-space:nowrap}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:55vh 45vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="cv"></canvas>
    <div id="legend"></div>
    <div id="tip"></div>
    <div id="hud"></div>
    <div id="zoomCtl">
      <button id="zIn" title="放大（+）">＋</button>
      <button id="zOut" title="縮小（-）">－</button>
      <button id="zFit" class="small" title="全圖（0 / 雙擊）">全圖</button>
    </div>
  </div>
  <aside>
    <div class="ctrl">
      <h1 id="title"></h1>
      <div class="row"><label>伺服器組</label><select id="grp"></select></div>
      <div class="row"><label>開服日期</label><input type="date" id="openDate"><span class="note" style="padding:0">（UTC+8，可留空）</span></div>
      <div class="row"><label>時間點</label><input type="range" id="t" min="0" step="1"></div>
      <div class="row"><span id="timeLabel"></span><label style="min-width:0"><input type="checkbox" id="allOpen"> 全部視為開放</label></div>
      <div class="row"><input id="q" placeholder="搜尋城池 / 關口 / 地道 / 黑山 / 四境" style="flex:1"></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-k="state" class="on">州郡</button><button data-k="gate">關口</button><button data-k="tunnel">地道</button><button data-k="city">城池</button><button data-k="black">黑山</button><button data-k="jungle">四境</button>
    </div>
    <div id="list"></div>
  </aside>
</div>

function stateColor(id) {
  const s = stateById[id];
  if (!s) return null;
  if (s.side === 101) return C('--shu');

  return neutralPalette[id % neutralPalette.length];
}
const overlay = document.createElement('canvas');
overlay.width = IW; overlay.height = IH;
(function paintOverlay() {
  const o = overlay.getContext('2d'), im = o.createImageData(IW, IH);
  for (let i = 0; i < mask.length; i++) {

    const n = parseInt(col.slice(1), 16);

})();

}

// 地道連線模式：all = 全部淡色顯示、選取者高亮；click = 只顯示被點選地道群的連線
const store = {

// ---------- 視角 ----------
let view = { s: 0, x: 0, y: 0 };
const MAX_S = 60;
const fitView = () => {
  const r = wrap.getBoundingClientRect();
  const s = Math.min(r.width / IW, r.height / IH) * 0.95;
  return { s, x: (r.width - IW * s) / 2, y: (r.height - IH * s) / 2 };

const scr = (u, v) => [u * view.s + view.x, v * view.s + view.y];

// 以畫面座標 (mx, my) 為錨點縮放
function zoomAt(mx, my, ns) {
  ns = clampS(ns);

// 平滑移動視角：以畫面中心對應的地圖點與縮放（對數）插值
let animId = 0;

function nextFrame(cb) {

}

// ---------- 繪製 ----------
let hits = [];
const ugById = Object.fromEntries(D.ugroups.map(g => [g.id, g]));

const gateById = Object.fromEntries(D.gates.map(g => [g.id, g]));
const nodeById = id => cityById[id] || gateById[id];
// 連線鄰接表：id → 相連的城池 / 關口
const linksOf = {};
for (const [a, b] of D.cityLinks) { (linksOf[a] ||= []).push(b); (linksOf[b] ||= []).push(a); }
// focus：定位標記；pinned：固定顯示的資訊框；selT：點選中的地道群
let focus = null, pinned = null, selT = null, hoverT = null, hoverOw = null, tunnelAct = null, hoverHit = null;
// 城池 → 它授予許可權的戍烽隘
const owByCity = {};
for (const o of D.oneway) for (const cid of o.permIds) (owByCity[cid] ||= []).push(o);
function draw() {
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, r.width, r.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(baseImg, view.x, view.y, IW * view.s, IH * view.s);
  if (layers.state[1]) ctx.drawImage(overlay, view.x, view.y, IW * view.s, IH * view.s);
  hits = [];
  const z = view.s;
  // 州名
  if (layers.state[1]) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const s in stateCenter) {
      const st = stateById[s]; if (!st || stateCenter[s][2] < 60) continue;
      const [x, y] = scr(stateCenter[s][0], stateCenter[s][1]);
      ctx.font = `600 ${Math.max(12, Math.min(22, z * 3.2))}px sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      ctx.fillText(st.name + (st.born ? '★' : ''), x, y);
    }
  }
  // 城池連線（NPCCity Const 27）：端點可能是城池或關口；經過關口的連線另以關口色標示
  if (layers.cityLink[1]) {
    const lw = Math.max(1, Math.min(2.5, z / 4));
    for (const viaGate of [false, true]) {
      ctx.strokeStyle = viaGate ? 'rgba(63,208,208,.6)' : 'rgba(170,180,195,.45)';
      ctx.lineWidth = viaGate ? lw + 0.8 : lw;
      ctx.beginPath();
      for (const [a, b] of D.cityLinks) {
        const A = nodeById(a), B = nodeById(b); if (!A || !B) continue;
        if ((gateById[a] || gateById[b] ? true : false) !== viaGate) continue;
        const [x1, y1] = scr(...toPx(A.x, A.z)), [x2, y2] = scr(...toPx(B.x, B.z));
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }
  }
  // 地道連通
  if (layers.tunnel[1]) {
    // all：全部淡色、選取 / 滑鼠所在者高亮；click：只畫被點選地道群的連線
    const act = tunnelMode === 'click' ? selT : (selT || hoverT);
    const actSet = act ? new Set([act.id, ...act.link]) : null;
    const seen = new Set();
    ctx.setLineDash([5, 4]);
    for (const g of D.ugroups) for (const l of g.link) {
      const key = g.id < l ? g.id + '-' + l : l + '-' + g.id;
      if (seen.has(key) || !ugById[l]) continue; seen.add(key);
      const hot = act && (g.id === act.id || l === act.id);
      if (!hot && tunnelMode === 'click') continue;
      ctx.lineWidth = hot ? 3 : 1.2;
      ctx.strokeStyle = hot ? C('--tunnel') : 'rgba(255,211,77,.28)';
      const [x1, y1] = scr(...toPx(g.x, g.z)), [x2, y2] = scr(...toPx(ugById[l].x, ugById[l].z));
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.setLineDash([]);
    tunnelAct = actSet;
    if (z > 9) {
      ctx.fillStyle = 'rgba(255,211,77,.7)';
      for (const e of D.uexits) { const [x, y] = scr(...toPx(e.x, e.z)); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
    }
    for (const g of D.ugroups) {

  if (layers.jungle && layers.jungle[1]) {
    for (const t of D.jungle.tents) {
      const [x, y] = scr(...toPx(t.x, t.z)), s = Math.max(6, Math.min(11, z * 1.2));
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y + s * 0.7); ctx.lineTo(x - s, y + s * 0.7); ctx.closePath();
      ctx.fillStyle = '#111'; ctx.fill(); ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 1.4; ctx.stroke();

      hits.push({ x, y, r: s + 2, kind: 'jcamp', o: c });

    for (const b of D.black.camps) {
      const [x, y] = scr(...toPx(b.x, b.z)), s = Math.max(5, Math.min(10, z * 1.1)) + b.lv * 0.35;
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.9, y + s * 0.65); ctx.lineTo(x - s * 0.9, y + s * 0.65); ctx.closePath();

      hits.push({ x, y, r: s + 2, kind: 'black', o: b });
      if (z > 6) label(`黑山 Lv${b.lv}`, x, y + s + 8, '#ffb48a');
    }

    for (const c of D.cities) {
      const [x, y] = scr(...toPx(c.x, c.z));

      const rr = Math.max(2, (1.2 + c.lv * 0.35) * Math.max(1, z / 4));

// ---------- 資訊框 ----------
function placeTip(text, x, y) {
  const r = wrap.getBoundingClientRect();
  tip.textContent = text; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(x + 14, r.width - w - 4)) + 'px';
  tip.style.top = Math.max(4, Math.min(y + 14, r.height - h - 4)) + 'px';
}
function showPinned() {
  if (!pinned) { tip.style.display = 'none'; return; }
  const [x, y] = scr(...toPx(pinned.o.x, pinned.o.z));
  const r = wrap.getBoundingClientRect();
  if (x < 0 || y < 0 || x > r.width || y > r.height) { tip.style.display = 'none'; return; }
  placeTip(describe(pinned.kind, pinned.o), x, y);
}
function label(t, x, y, col, w = 500) {
  ctx.font = `${w} 12px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(t, x, y);
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}

// ---------- 互動 ----------
const local = e => { const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function hitAt(mx, my) {
  let h = null, best = 1e9;
  for (const t of hits) { const d = Math.hypot(t.x - mx, t.y - my); if (d < t.r && d < best) { best = d; h = t; } }
  return h;
}

// 滑鼠移動（未按下）：座標 / 州郡顯示與懸停提示
function hover(mx, my) {
  const u = (mx - view.x) / view.s, v = (my - view.y) / view.s;
  const [gx, gz] = toGrid(u, v);
  const st = u >= 0 && v >= 0 && u < IW && v < IH ? stateById[mask[Math.floor(v) * IW + Math.floor(u)]] : null;
  $('#hud').textContent = `座標 (${gx}, ${gz})` + (st ? `　${st.name}` : '');
  const h = hitAt(mx, my);
  const nt = h && h.kind === 'tunnel' ? h.o : null, no = h && h.kind === 'oneway' ? h.o : null;
  hoverHit = h;
  if (nt !== hoverT || no !== hoverOw) { hoverT = nt; hoverOw = no; draw(); }
  if (h) placeTip(describe(h.kind, h.o), mx, my); else showPinned();
  wrap.style.cursor = h ? 'pointer' : '';
}

// 點擊 / 輕觸：選取地道群、固定資訊框；點空白處取消
function tap(mx, my) {
  const h = hitAt(mx, my);
  if (!h) { selT = null; pinned = null; focus = null; markRow(null); draw(); return; }
  if (h.kind === 'tunnel') selT = selT === h.o ? null : h.o;
  pinned = { kind: h.kind, o: h.o }; focus = h.o; markRow(h.o);
  draw();
}

// 指標事件：單指 / 滑鼠拖曳平移，雙指捏合縮放

  else if (p.length >= 2) {
    const [a, b] = p;
    gesture = { kind: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s,
      u: ((a.x + b.x) / 2 - view.x) / view.s, v: ((a.y + b.y) / 2 - view.y) / view.s };

wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('#zoomCtl, #legend')) return;
  animId++; // 中斷進行中的動畫
  try { wrap.setPointerCapture(e.pointerId); } catch {}
  pts.set(e.pointerId, { x: local(e)[0], y: local(e)[1] });
  if (pts.size === 1) moved = false;
  beginGesture();

  const [mx, my] = local(e);
  if (!pts.has(e.pointerId)) { if (e.pointerType === 'mouse') hover(mx, my); return; }
  pts.set(e.pointerId, { x: mx, y: my });
  if (!gesture) return;

    if (Math.hypot(dx, dy) > 4) moved = true;
    if (!moved) return;
    view.x = gesture.vx + dx; view.y = gesture.vy + dy;
  } else {
    moved = true;
    const [a, b] = [...pts.values()];
    const ns = clampS(gesture.s * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d);
    view.s = ns; view.x = (a.x + b.x) / 2 - gesture.u * ns; view.y = (a.y + b.y) / 2 - gesture.v * ns;
  }
  hoverHit = null;
  draw();
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  const single = pts.size === 1;
  pts.delete(e.pointerId);
  if (single && !moved && e.type === 'pointerup') tap(...local(e));
  beginGesture();
  if (!pts.size) wrap.classList.remove('drag');
}
wrap.addEventListener('pointerup', endPointer);
wrap.addEventListener('pointercancel', endPointer);
wrap.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pts.size) { hoverHit = null; hoverT = hoverOw = null; draw(); } });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  animId++;
  const [mx, my] = local(e);
  zoomAt(mx, my, view.s * Math.exp(-e.deltaY * 0.0015));
  draw();
}, { passive: false });
wrap.addEventListener('dblclick', e => { if (!e.target.closest('#zoomCtl, #legend')) animateTo(fitView()); });
$('#zIn').addEventListener('click', () => zoomBy(1.6));
$('#zOut').addEventListener('click', () => zoomBy(1 / 1.6));
$('#zFit').addEventListener('click', () => animateTo(fitView()));
addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === '+' || e.key === '=') zoomBy(1.6);
  else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.6);
  else if (e.key === '0') animateTo(fitView());
  else if (e.key === 'Escape') { selT = null; pinned = null; focus = null; markRow(null); draw(); }
});

const sn = id => stateById[id]?.name ?? id;
function describe(kind, o) {
  if (kind === 'city') {
    const u = cityUnlock(o);
    const ows = owByCity[o.id] || [];
    const nbGates = (linksOf[o.id] || []).map(id => gateById[id]?.name).filter(Boolean);
    return `${o.name}　Lv${o.lv}${o.cap ? '（州府）' : ''}\n${sn(o.st)}　(${o.x}, ${o.z})\n開放：${fmtUnlock(u)}${isOpen(u) ? '' : '　🔒'}` +
      (nbGates.length ? `\n相連關口：${nbGates.join('、')}` : '') +
      (ows.length ? `\n佔領後可在戍烽隘鋪設烽火臺：${ows.map(w => `(${w.x}, ${w.z})`).join('、')}` : '') + buffText(o);
  }
  if (kind === 'gate') {
    const u = gateUnlock(o);
    const nb = (linksOf[o.id] || []).map(id => nodeById(id)?.name).filter(Boolean);
    return `${o.name}${o.kind === 3 ? '（陣營關）' : '（關隘）'}　Lv${o.lv}\n連接：${o.link.map(sn).join(' ⇄ ')}\n` +
      (nb.length ? `相連城池：${nb.join('、')}\n` : '') +
      (o.faction.length ? `限定陣營：${o.faction.map(f => stateSideName(f)).join('、')}\n` : '') +
      `開放：${fmtUnlock(u)}${isOpen(u) ? '' : '　🔒'}\n(${o.x}, ${o.z})`;
  }
  if (kind === 'tunnel') {
    const ex = D.uexits.filter(e => e.g === o.id).length;
    return `${o.name}　出入口 ${ex} 個\n連通：${o.link.map(l => ugById[l]?.name ?? l).join('、')}\n(${o.x}, ${o.z})\n客戶端設定未提供地道開放時間`;
  }
  if (kind === 'jcamp') {
    const R = D.jungle.rule;
    return `${o.name}${o.elite ? '（精銳）' : ''}　(${o.x}, ${o.z})\n挑戰人數上限：${o.ch}\n` +
      o.steps.map(s => `・${s.stage}：Lv${s.lv}，建議 ${(s.troops || 0).toLocaleString()}（兵種等級 ${s.tier}），${s.reward}`).join('\n') +
      `\n開放：${R.open} 起至 ${R.close} 前；每日 ${R.hours}，每日獎勵 ${R.daily} 次` + (o.elite ? `\n${R.eliteText}` : '');
  }
  if (kind === 'jtent') return `補給大營　${sn(o.st)}　(${o.x}, ${o.z})\n可使用：${o.allow.join('、')} 的聯盟\n可調動部曲上限：${D.jungle.rule.tentCap}`;
  if (kind === 'black') {
    const L = D.black.levels[o.d] || {};
    return `${L.name}　${sn(o.st)}　(${o.x}, ${o.z})\n建議兵力：${(L.troops || 0).toLocaleString()}（兵種等級 ${L.tier}）\n` +
      `寨門耐久：${(L.gate || 0).toLocaleString()}　時間設定：${Math.round((L.time || 0) / 60)} 分鐘\n擊殺首領獎勵：${L.reward}\n只可對本州的黑山軍發起組隊討伐`;
  }
  if (kind === 'oneway') return `戍烽隘　(${o.x}, ${o.z})\n不擋部曲行軍，只攔截烽火臺領地推進\n許可權城池：${o.perm.join('、') || '—'}\n聯盟佔領上述城池${o.perm.length > 1 ? '之一' : ''}後，才能在隘內鋪設烽火臺`;
  return '';
}
// 城池增益（關閉「城池增益」圖層時不顯示）
function buffText(c) {
  if (!layers.buff[1]) return '';
  return (c.occ ? `\n首占獎勵：${c.occ}` : '') + c.buffs.map(b => `\n・${b.n}：${b.d}`).join('');
}
function stateSideName(side) { const s = D.states.find(s => s.side === side); return s ? s.sideName : side; }
const gateSet = new Set(D.gates), owSet = new Set(D.oneway), blackSet = new Set(D.black.camps);
const jcampSet = new Set(D.jungle.camps), jtentSet = new Set(D.jungle.tents);
function kindOf(o) {
  if (cityById[o.id] === o) return 'city';
  if (ugById[o.id] === o) return 'tunnel';
  if (gateSet.has(o)) return 'gate';
  if (owSet.has(o)) return 'oneway';
  if (blackSet.has(o)) return 'black';
  if (jcampSet.has(o)) return 'jcamp';
  if (jtentSet.has(o)) return 'jtent';
  return 'state';
}
// 平滑移動到目標並固定其資訊框；州郡（無座標）移到州遮罩重心
function goTo(o) {
  if (!(view.s > 0)) fit();
  const r = wrap.getBoundingClientRect(), kind = kindOf(o);
  let u, v, s;
  if (o.x == null) {
    const c = stateCenter[o.id]; if (!c) return;
    [u, v] = c; s = Math.max(view.s, fitView().s * 2.5);
  } else {
    [u, v] = toPx(o.x, o.z); s = Math.max(view.s, 8);
  }
  if (kind === 'tunnel') selT = o;
  if (kind === 'state') { pinned = null; focus = null; } else { pinned = { kind, o }; focus = o; }
  hoverHit = null;
  markRow(o);
  // 窄螢幕（地圖在清單上方）時先把地圖捲回可見範圍
  if (wrap.getBoundingClientRect().bottom < 40) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  animateTo({ s, x: r.width / 2 - u * s, y: r.height / 2 - v * s });
}
let selRef = null;
function markRow(o) {
  selRef = o;
  document.querySelectorAll('#list tr[data-i]').forEach(tr => tr.classList.toggle('sel', !!o && rowRefs[+tr.dataset.i] === o));
}

// ---------- 側欄清單 ----------
let tab = 'state';
if (!D.jungle.camps.length) document.querySelector('#tabs button[data-k=jungle]').remove();
$('#tabs').addEventListener('click', e => {
  const k = e.target.dataset.k; if (!k) return;
  tab = k; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); renderList();
});
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let rowRefs = [];
function row(o, cells) { rowRefs.push(o); return `<tr class="click" data-i="${rowRefs.length - 1}">${cells.map(c => `<td>${c}</td>`).join('')}</tr>`; }
const openCls = u => isOpen(u) ? 'open' : 'lock';
function renderList() {
  rowRefs = [];
  const q = $('#q').value.trim();
  const m = s => !q || s.includes(q);
  let h = '';
  if (tab === 'state') {
    h = '<table><tr><th>州郡</th><th>城池開放</th><th>相連關口</th></tr>';
    for (const s of D.states) {
      const cs = D.cities.filter(c => c.st === s.id);
      const gs = D.gates.filter(g => g.link.includes(s.id));
      if (!m(s.name) && !cs.some(c => m(c.name))) continue;
      const days = cs.map(c => cityUnlock(c)?.[0]).filter(d => d != null);
      const cap = cs.find(c => c.cap);
      const range = days.length ? `第 ${Math.min(...days)}～${Math.max(...days)} 天<br><span class="note" style="padding:0">${cs.length} 城${cap ? `，州府 ${esc(cap.name)}（第 ${cityUnlock(cap)?.[0]} 天）` : ''}</span>` : '—';
      h += row(cap || s, [
        `<b>${esc(s.name)}</b>${s.born ? ' <span class="tag">出生州</span>' : ''}${s.sideName ? `<br><span class="tag">${esc(s.sideName)}</span>` : ''}`,
        range,
        gs.map(g => `<span class="${openCls(gateUnlock(g))}">${esc(g.name)}</span>`).join('、') || '—']);
    }
    h += '</table><div class="note">城池在開放日的 ' + D.cityUnlockHour + ':00 解鎖；州郡無獨立開放時間，以州內城池與相連關口為準。</div>';
  } else if (tab === 'gate') {
    h = '<table><tr><th>關口</th><th>連接</th><th>開放</th></tr>';
    for (const g of [...D.gates].sort((a, b) => hoursOf(gateUnlock(a)) - hoursOf(gateUnlock(b)) || a.id - b.id)) {
      if (!m(g.name) && !g.link.some(l => m(String(sn(l))))) continue;
      const u = gateUnlock(g);
      h += row(g, [`<b>${esc(g.name)}</b><br><span class="tag">${g.kind === 3 ? '陣營關' : '關隘'}</span>`,
        g.link.map(l => esc(sn(l))).join(' ⇄ '), `<span class="${openCls(u)}">${fmtUnlock(u)}</span>`]);
    }
    h += '</table>';
  } else if (tab === 'tunnel') {
    h = '<table><tr><th>地道群</th><th>連通至</th><th>口</th></tr>';
    for (const g of D.ugroups) {
      if (!m(g.name) && !g.link.some(l => m(ugById[l]?.name || ''))) continue;
      h += row(g, [`<b>${esc(g.name.replace('-地道', ''))}</b>`, g.link.map(l => esc((ugById[l]?.name || l).replace('-地道', ''))).join('、'),
        D.uexits.filter(e => e.g === g.id).length]);
    }
    h += '</table><div class="note">連通來自 Underpass.lua 的 Group.Link：進入任一地道口，可從連通群組的任一出口離開。點選列表或地圖上的地道群可顯示其目的地。</div>';
  } else if (tab === 'jungle') {
    const R = D.jungle.rule;
    h = '<table><tr><th>營地</th><th>州郡 / 座標</th><th>等級（依階段）／可用出生州</th></tr>';
    for (const t of D.jungle.tents) {
      if (!m('補給大營') && !t.allow.some(a => m(a)) && !m(String(sn(t.st)))) continue;
      h += row(t, ['<b>補給大營</b>', esc(sn(t.st)), esc(t.allow.join('、'))]);
    }
    for (const c of [...D.jungle.camps].sort((a, b) => b.elite - a.elite || a.id - b.id)) {
      if (!m(c.name)) continue;
      h += row(c, [`<b>${esc(c.name)}</b>`, `${c.x}, ${c.z}`, c.steps.map(s => 'Lv' + s.lv).join('→')]);
    }
    h += `</table><div class="note">肅清四境：${esc(R.open)} 階段開放、${esc(R.close)} 關閉；每日 ${esc(R.hours)}，每日獎勵 ${R.daily} 次。${esc(R.eliteText)}。補給大營每座可調動 ${R.tentCap} 支部曲。</div>`;
  } else if (tab === 'black') {
    h = '<table><tr><th>黑山軍</th><th>州郡</th><th>建議兵力</th></tr>';
    for (const b of D.black.camps) {
      const L = D.black.levels[b.d] || {};
      if (!m(String(sn(b.st))) && !m(L.name || '')) continue;
      h += row(b, [`<b>${esc(L.name)}</b>`, esc(sn(b.st)), (L.troops || 0).toLocaleString()]);
    }
    h += '</table><div class="note">黑山軍：只可對本州的黑山軍發起組隊討伐；拆除寨門後開啟討伐，擊殺首領方可獲得獎勵。開放階段以伺服器為準。</div>';
  } else {
    h = '<table><tr><th>城池</th><th>州郡</th><th>開放</th></tr>';
    for (const c of [...D.cities].sort((a, b) => b.lv - a.lv || a.id - b.id)) {
      if (!m(c.name) && !m(String(sn(c.st)))) continue;
      const u = cityUnlock(c);
      const bdg = layers.buff[1] ? [...new Set(c.buffs.map(b => b.k))].map(k => `<span class="bdg" title="${BUFF_META[k][0]}" style="background:${BUFF_META[k][1]}"></span>`).join('') : '';
      h += row(c, [`<b>${esc(c.name)}</b> Lv${c.lv}${c.cap ? ' <span class="tag">州府</span>' : ''}${bdg ? '<br>' + bdg : ''}`, esc(sn(c.st)), `<span class="${openCls(u)}">${fmtUnlock(u)}</span>`]);
    }
    h += '</table>';
  }
  $('#list').innerHTML = h;
  markRow(selRef);
}
$('#list').addEventListener('click', e => { const tr = e.target.closest('tr[data-i]'); if (tr) goTo(rowRefs[+tr.dataset.i]); });
$('#q').addEventListener('input', renderList);
$('#legend').addEventListener('change', e => { if (e.target.dataset.l === 'buff') renderList(); });
const refresh = () => { draw(); renderList(); };
slider.addEventListener('input', refresh);
$('#allOpen').addEventListener('change', refresh);
$('#openDate').addEventListener('change', refresh);
grpSel.addEventListener('change', () => { resetSlider(); refresh(); });

$('#title').textContent = document.title;
resetSlider(); slider.value = slider.max;
baseImg.onload = () => { resize(); renderList(); };
addEventListener('resize', resize);
new ResizeObserver(resize).observe(wrap);
</script>
</body>
