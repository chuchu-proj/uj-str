<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建築總覽模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15181a; --bg-2: #1d2124; --panel: rgba(18, 21, 23, .88); --row: #22272a; --row-2: #1a1e20;
  --line: #3a3f40; --text: #ece6d6; --muted: #9b958a; --gold: #e6c27a; --gold-deep: #b48a3c;
  --red: #ef4b3f; --green: #5fd46e; --pill: #121212; --cream: #efe7d1; --cream-text: #2a241b;
  --serif: "Noto Serif TC", "DFKai-SB", "BiauKai", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(120% 80% at 30% 0%, #2a3236 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text); font: 15px/1.45 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* 頂欄 */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; background: linear-gradient(#0e1011, rgba(14, 16, 17, .92)); border-bottom: 1px solid var(--line); }
.title { font: 900 26px/1 var(--serif); color: var(--gold); letter-spacing: 2px; margin-right: auto;
  text-shadow: 0 2px 0 #000; }
.res { display: flex; align-items: center; gap: 6px; background: #0a0b0b; border: 1px solid #2c2f30;
  border-radius: 999px; padding: 3px 12px 3px 6px; }
.res .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
  font-weight: 700; color: #1b1b1b; }
.res input { width: 64px; background: transparent; border: 0; outline: 0; font-size: 17px; text-align: right; }
.res .unit { color: var(--muted); font-size: 13px; }
.res .rate { display: flex; align-items: center; gap: 2px; border-left: 1px solid #2c2f30; padding-left: 6px; color: var(--green); }
.res .rate input { width: 62px; font-size: 14px; color: var(--green); }
.res input::placeholder { color: #5d5a54; }
.btn { background: #2b3033; border: 1px solid #4a4f50; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; background: #0a0b0b;
  border: 1px solid #2c2f30; border-radius: 999px; padding: 5px 12px; }
.toggle select { background: transparent; border: 0; color: var(--gold); font: inherit; cursor: pointer; }
.toggle select option { background: #181b1d; color: var(--text); }
.hoard-chip { display: flex; align-items: center; gap: 4px; border-radius: 999px; background: #0a0b0b; border-color: #2c2f30; }
.hoard-chip b { color: var(--gold); }
.hoard-chip span { color: var(--green); font-variant-numeric: tabular-nums; font-size: 13px; }
.top-fold { display: none; }
/* 手機版頂欄：資源每行一欄、辨識按鈕並排、屯田令與計算方式各一行、其餘三鈕一行；可收起 */
@media (max-width: 640px) {
  .topbar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 8px 12px; }
  .topbar > * { grid-column: span 6; }
  .topbar .title { grid-column: span 4; margin: 0; align-self: center; }
  .topbar .top-fold { display: block; grid-column: span 2; padding: 5px 8px; }
  .topbar > .btn[data-ocr-mode] { grid-column: span 3; }
  .topbar > #timeMode, .topbar > #shareBtn, .topbar > #resetBtn { grid-column: span 2; padding: 6px 4px; font-size: 14px; white-space: nowrap; }
  .topbar.folded > :not(.title):not(.top-fold) { display: none; }
  .res { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto minmax(0, 1.1fr); padding: 3px 12px 3px 6px; }
  .res input, .res .rate input { width: 100%; min-width: 0; }
  .res .rate { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }
  .hoard-chip { justify-content: center; }
  .toggle { justify-content: center; }
}
.hoard { width: min(560px, calc(100vw - 32px)); }
.share { width: min(620px, calc(100vw - 32px)); }
.share textarea { width: 100%; min-height: 84px; margin-top: 10px; background: #0d0f10; border: 1px solid var(--line); border-radius: 4px;
  padding: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--text); word-break: break-all; resize: vertical; }
.share ul { margin: 6px 0; padding-left: 20px; }
.hoard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 14px; }
.hoard-grid label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hoard-grid label.chk { grid-column: 1 / -1; justify-content: flex-start; }
.hoard-grid input[type=number], .hoard-grid input:not([type]) { width: 90px; background: #0d0f10; border: 1px solid #4a4f50;
  border-radius: 4px; padding: 4px 6px; text-align: center; }
.hoard-grid input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; }
.hoard-sub { grid-column: 1 / -1; color: var(--gold); font: 900 15px/1 var(--serif); margin-top: 6px; }
.hoard-preview { margin-top: 12px; padding: 8px 10px; background: #111314; border: 1px solid #2f3435; border-radius: 6px; font-size: 13px; line-height: 1.7; }
@media (max-width: 520px) { .hoard-grid { grid-template-columns: 1fr; } }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.gold { background: linear-gradient(#e9c77f, #b68b3d); color: #241a08; border-color: #f2d699; font-weight: 700; }
.btn.cream { background: linear-gradient(#f6efdc, #e2d6b8); color: var(--cream-text); border: 2px solid #c9b88f;
  font: 600 22px/1 var(--serif); letter-spacing: 4px; padding: 14px; width: 100%; border-radius: 4px; }

/* 主體 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; max-width: 1400px;
  margin: 0 auto; padding: 18px 16px 60px; }
@media (max-width: 1020px) { .layout { grid-template-columns: 1fr; } }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.chip .k { font-size: 12px; color: var(--muted); }
.chip .v { font-size: 18px; font-weight: 600; }

/* 建築格子 */
.tiers { position: relative; padding-left: 58px; }
.tiers::before { content: ""; position: absolute; left: 22px; top: 30px; bottom: 30px; width: 4px;
  background: linear-gradient(var(--gold-deep), var(--gold), var(--gold-deep)); border-radius: 2px; }
.tier { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px;
  margin-bottom: 22px; }
.tier-mark { position: absolute; left: -58px; top: 50%; transform: translateY(-80%); width: 48px; height: 48px;
  display: grid; place-items: center; }
.tier-mark span { width: 34px; height: 34px; transform: rotate(45deg); background: #121314; border: 2px solid var(--gold);
  display: grid; place-items: center; box-shadow: 0 0 0 3px #121314; }
.tier-mark b { transform: rotate(-45deg); font: 900 18px/1 var(--serif); color: var(--gold); }
.card { display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; background: none; border: 0;
  padding: 0; min-width: 0; }
.plate { width: 100%; max-width: 190px; aspect-ratio: 1.6; position: relative; display: grid; place-items: center; }
.plate::before { content: ""; position: absolute; inset: 38% 4% 4%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #8fa35a, #5d7038 60%, #3c4826); box-shadow: 0 6px 14px rgba(0, 0, 0, .6); }
.plate .house { position: relative; width: 58%; aspect-ratio: 1.15; margin-bottom: 14%;
  background: linear-gradient(#304a52, #1d3036); clip-path: polygon(50% 0, 100% 34%, 92% 34%, 92% 100%, 8% 100%, 8% 34%, 0 34%);
  display: grid; place-items: center; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .5)); }
.plate .house::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 0; height: 58%;
  background: linear-gradient(#7b3f2b, #4e2619); }
.plate .house b { position: relative; z-index: 1; margin-top: 30%; font: 900 clamp(16px, 2.2vw, 26px)/1 var(--serif);
  color: #f4e3b8; text-shadow: 0 2px 2px #000; }
.card.sel .plate::before { box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(230, 194, 122, .6); }
.card.lock .plate { filter: grayscale(.85) brightness(.6); }
.label { margin-top: -10px; position: relative; display: flex; align-items: center; gap: 6px; max-width: 100%;
  background: var(--pill); border: 1px solid #3b3b3b; border-radius: 999px; padding: 3px 14px;
  font: 600 18px/1.2 var(--serif); white-space: nowrap; box-shadow: 0 2px 4px rgba(0, 0, 0, .7); }
.label .lv { font-family: system-ui, sans-serif; font-weight: 600; }
.label .lv i { font-style: normal; }
.label .lv i.red { color: var(--red); }
.label .up { color: var(--green); font-size: 16px; font-weight: 900; }
.label .max { color: var(--gold); font: 700 12px/1 system-ui; }
.tier.top .card { grid-column: 2 / span 2; }
@media (max-width: 640px) {
  .tier { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
  .tier.top .card { grid-column: 2; }
  .label { font-size: 14px; padding: 2px 8px; gap: 0 4px; flex-wrap: wrap; justify-content: center; border-radius: 12px; }
  .tiers { padding-left: 46px; }
  .tier-mark { left: -48px; }
  .title { font-size: 22px; }
}

/* 右側面板 */
.panel { position: sticky; top: 76px; align-self: start; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 18px 16px; }
@media (max-width: 1020px) { .panel { position: static; } }
.panel h2 { margin: 0 0 6px; font: 900 40px/1.1 var(--serif); color: var(--gold); letter-spacing: 6px;
  text-shadow: 0 3px 0 #000; }
.divider { height: 2px; background: linear-gradient(90deg, transparent, var(--gold-deep), transparent); margin: 6px 0 12px; }
.prow { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; background: var(--row);
  margin-bottom: 4px; padding: 6px 10px 6px 4px; border-radius: 2px; }
.prow:nth-child(even) { background: var(--row-2); }
.prow .ic { width: 34px; height: 34px; display: grid; place-items: center; background: #0f1112; border: 1px solid #4a4f50;
  border-radius: 4px; font: 900 15px/1 var(--serif); color: var(--gold); }
.prow .k { font: 600 18px/1.2 var(--serif); }
.prow .v { font-size: 17px; text-align: right; }
.arrow { color: var(--gold); font-weight: 900; margin: 0 4px; }
.ok { color: var(--green); }
.bad { color: var(--red); }
.sect { font: 900 22px/1 var(--serif); color: var(--gold); margin: 20px 0 10px; letter-spacing: 2px; }
.warn { text-align: center; color: var(--red); font: 600 18px/1.4 var(--serif); margin: 18px 0 10px; min-height: 25px; }
.plan-ctl { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.plan-ctl input { width: 70px; background: #0d0f10; border: 1px solid #4a4f50; border-radius: 4px; padding: 6px; text-align: center; }

/* 路徑 */
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-top: 8px; }
.box h3 { margin: 0 0 8px; font: 900 20px/1 var(--serif); color: var(--gold); }
.scroll { max-height: 440px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 6px 8px; border-bottom: 1px solid #2c3132; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: #181b1d; color: var(--muted); font-weight: 500; font-size: 12px; }
td.r, th.r { text-align: right; }
.reason-目標 { color: var(--gold); font-weight: 700; }
.reason-補繁榮度 { color: var(--muted); }
.eval { margin-top: 12px; }
.eval h4 { margin: 0 0 6px; font: 900 16px/1 var(--serif); color: var(--gold); }
.eval td.good { color: var(--green); font-weight: 700; }
.eval td.bad { color: var(--red); }
.eval td.mixed { color: var(--gold); }
.eval small { color: var(--muted); }
.note-sm { color: var(--muted); font-size: 12px; margin-top: 4px; }
td.hoard-cell { color: var(--gold); font-weight: 700; }
.eval .btn { padding: 2px 10px; font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 8px; }
.prio { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.prio-title { font: 900 16px/1 var(--serif); color: var(--gold); margin-right: 4px; }
.prio-empty { color: var(--muted); font-size: 13px; }
.prio-item { display: inline-flex; align-items: center; gap: 4px; background: #0f1112; border: 1px solid var(--gold-deep);
  border-radius: 999px; padding: 2px 4px 2px 10px; }
.prio-item input { width: 44px; background: transparent; border: 0; border-left: 1px solid #3a3f40; text-align: center; color: var(--gold); }
.prio-name, .prio-del { background: none; border: 0; cursor: pointer; padding: 0 2px; }
.prio-name { font: 600 15px/1 var(--serif); }
.prio-del { color: var(--muted); font-size: 16px; }
.prio-del:hover { color: var(--red); }
.prio-item.zero { border-color: #3a3f40; opacity: .6; }
.prio-item:not(:has(.prio-del)) { padding-right: 8px; }
.prio-badge { background: linear-gradient(#f0cf83, #b8893a); color: #2a1d08; font: 900 12px/1 var(--serif); padding: 3px 4px;
  border-radius: 3px; margin-right: 2px; }

/* 截圖辨識 */
dialog { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: #181b1d; color: var(--text);
  border: 1px solid var(--gold-deep); border-radius: 8px; padding: 18px; }
dialog::backdrop { background: rgba(0, 0, 0, .7); }
dialog h3 { margin: 0 0 6px; font: 900 22px/1 var(--serif); color: var(--gold); }
.guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 14px; align-items: start;
  margin-bottom: 12px; font-size: 14px; }
.guide ol { margin: 0; padding-left: 20px; line-height: 1.7; }
.guide b { color: var(--gold); }
.guide .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.guide figure { margin: 0; }
.guide img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; }
.guide figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; text-align: center; }
@media (max-width: 720px) { .guide { grid-template-columns: 1fr; } }
.drop { border: 2px dashed #4a4f50; border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.hover { border-color: var(--gold); color: var(--text); }
#ocrCanvas { width: 100%; height: auto; margin-top: 10px; border-radius: 4px; display: none; }
.ocr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
.ocr-item { background: #111314; border: 1px solid #2f3435; border-radius: 6px; padding: 6px 8px; display: grid;
  grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.ocr-item.warnc { border-color: var(--red); }
.ocr-item canvas { grid-column: 1 / -1; width: 100%; height: 26px; object-fit: contain; background: #fff; border-radius: 3px; }
.ocr-item [data-res-stock], .ocr-item [data-res-rate] { width: 64px; }
.ocr-item input { width: 54px; background: #0d0f10; border: 1px solid #4a4f50; border-radius: 4px; padding: 2px 4px; text-align: center; }
.ocr-item .n { font-weight: 600; }
.ocr-item .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.ocr-tiers { display: block; position: relative; padding-left: 46px; }
/* 空間不夠時維持遊戲內的排列，讓使用者左右拖曳查看 */
.ocr-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 720px) {
  .ocr-grid.ocr-tiers { min-width: 640px; }
  dialog { width: calc(100vw - 16px); max-width: none; padding: 12px; }
}
.ocr-tiers::before { content: ""; position: absolute; left: 20px; top: 12px; bottom: 12px; width: 3px;
  background: linear-gradient(var(--gold-deep), var(--gold), var(--gold-deep)); border-radius: 2px; }
.ocr-row { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.ocr-row .tier-mark { left: -48px; transform: translateY(-50%); }
.ocr-row.top .ocr-item { grid-column: 2 / span 2; }
.ocr-tiers .ocr-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-width: 0; }
.ocr-tiers .ocr-item canvas { width: 100%; height: 26px; }
.ocr-tiers .pill { display: flex; align-items: center; gap: 6px; max-width: 100%; background: var(--pill); border: 1px solid #3b3b3b;
  border-radius: 999px; padding: 2px 10px; font: 600 15px/1.3 var(--serif); white-space: nowrap; }
.ocr-tiers .pill .lv { font: 600 14px/1 system-ui, sans-serif; }
.ocr-tiers .pill input { width: 44px; }
.ocr-tiers .s { text-align: center; }
.ocr-tiers .main .pill { border-color: var(--gold-deep); }
.ocr-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.ocr-foot input { width: 64px; background: #0d0f10; border: 1px solid var(--gold-deep); border-radius: 4px; padding: 5px; text-align: center; font-size: 17px; }
#ocrStatus { color: var(--muted); font-size: 13px; }
.engine { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #111314; border: 1px solid #2f3435;
  border-left: 3px solid var(--gold-deep); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
.engine[hidden] { display: none; }
.engine .msg { flex: 1 1 260px; }
.engine.ready { border-left-color: var(--green); }
.engine.error { border-left-color: var(--red); }
.engine .prog { flex: 0 0 140px; height: 6px; background: #2f3435; border-radius: 3px; overflow: hidden; }
.engine .prog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="title">建築總覽</div>
  <button class="btn top-fold" id="topFold" aria-expanded="true">收起 ▲</button>
  <div class="res" title="木材：目前庫存與每小時回復量（單位：萬，可留空）"><span class="ico" style="background:#c8935a">木</span><input id="stWood" placeholder="庫存"><span class="unit">萬</span><span class="rate">+<input id="rtWood" placeholder="0"><span class="unit">萬/時</span></span></div>
  <div class="res" title="石料：目前庫存與每小時回復量（單位：萬，可留空）"><span class="ico" style="background:#a9b1b6">石</span><input id="stMetal" placeholder="庫存"><span class="unit">萬</span><span class="rate">+<input id="rtMetal" placeholder="0"><span class="unit">萬/時</span></span></div>
  <div class="res" title="銅錢：目前庫存與每小時回復量（單位：萬，可留空）"><span class="ico" style="background:#e3be5d">錢</span><input id="stMoney" placeholder="庫存"><span class="unit">萬</span><span class="rate">+<input id="rtMoney" placeholder="0"><span class="unit">萬/時</span></span></div>
  <button class="btn gold" data-ocr-mode="build">辨識建築</button>
  <button class="btn gold" data-ocr-mode="res">辨識資源</button>
  <button class="btn hoard-chip" id="hoardOpen" title="屯田設定：屯田令數量、資源點等級、聯盟加成、每日購買">屯田令 <b id="hoardCnt">–</b>/10 <span id="hoardTimer"></span></button>
  <label class="toggle" title="分開計算：每種資源各自足夠才升級。總資源量（最快）：合計足夠就升級，缺的立刻用屯田令補。最少屯田令：與「最快」同時完成，但每一步等到資源各自足夠才升，只在期限到時才用屯田令補。">計算
    <select id="calcMode"><option value="split">分開計算</option><option value="pooled">總資源量（最快）</option><option value="lean">最少屯田令</option></select></label>
  <button class="btn" id="timeMode" title="切換時間顯示：剩餘時間（約 3 小時後）／實際時間點（11/03 14:25）">時間：剩餘時間</button>
  <button class="btn" id="shareBtn" title="把目前設定（含已計算的升級路徑）產生成連結分享，不含截圖">分享設定</button>
  <button class="btn" id="resetBtn">重設</button>
</header>

<div class="layout">
  <main>
    <div class="summary" id="summary"></div>
    <div class="prio" id="prio"></div>
    <div class="tiers" id="tiers"></div>

    <section class="box" id="planBox" hidden>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("build-data").textContent);
  const RES = ["Wood", "Metal", "Money"];
  const RES_NAME = { Wood: "木材", Metal: "石料", Money: "銅錢" };
  const RES_ICON = { Wood: "木", Metal: "石", Money: "錢" };
  const CAMPS = [41, 42, 44], ARMY = 55;   // 盾/弓/騎兵營（顯示兵階）、軍事府（顯示帶兵數）
  const STORE_KEY = "build_sim_state_v2";
  const MAIN = DATA.mainBid;
  const builds = {};
  for (const k in DATA.buildings) builds[+k] = DATA.buildings[k];
  const bids = Object.keys(builds).map(Number).sort((a, b) => a - b);

  // 與遊戲「建築總覽」相同的排列（階層 = 解鎖所需君主殿等級）
  const LAYOUT = [
    { tier: 1, bids: [48, 40, 6, 56] },
    { tier: 2, bids: [46, 19, 5] },
    { tier: 4, bids: [41, 42, 44] },
    { tier: 6, bids: [47, 10, 3] },
    { tier: 8, bids: [14, 12, 55] },
  ];
  const OTHERS = [MAIN].concat(bids.filter(b => b !== MAIN && !LAYOUT.some(r => r.bids.includes(b))));

  const fmt = n => (n || 0).toLocaleString("en-US");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);

  // ---------- 模擬核心 ----------
  class PlanError extends Error {}
  const keyLess = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] < b[i]; return false; };
  class Sim {
    constructor(levels, priority) {
      this.levels = {};
      for (const bid of bids) this.levels[bid] = builds[bid].initLev;
      if (levels) for (const k in levels) if (builds[+k]) this.levels[+k] = +levels[k];
      this.priority = priority || {};
      this.steps = [];
    }
    info(bid, lev) { return builds[bid].levels[lev]; }
    clout() { let s = 0; for (const bid of bids) s += this.info(bid, this.levels[bid]).Clout || 0; return s; }
    power() { let s = 0; for (const bid of bids) s += this.info(bid, this.levels[bid]).Power || 0; return s; }
    check(bid) {
      const lev = this.levels[bid], b = builds[bid];
      if (lev >= b.maxLev) return ["已滿級"];
      const nxt = this.info(bid, lev + 1), reasons = [];
      for (const r of nxt.UpgradeLimit || [])
        if ((this.levels[r.bid] || 0) < r.lev) reasons.push(`需 ${builds[r.bid].name} Lv${r.lev}`);
      if (nxt.CloutLimit && this.clout() < nxt.CloutLimit)
        reasons.push(`繁榮度 ${fmt(this.clout())}/${fmt(nxt.CloutLimit)}`);
      return reasons;
    }
    cost(bid, lev) { const i = this.info(bid, lev); return { Wood: i.Wood || 0, Metal: i.Metal || 0, Money: i.Money || 0 }; }
    upgrade(bid, reason) {
      const p = this.check(bid);
      if (p.length) throw new PlanError(`${builds[bid].name} 無法升級：${p.join("、")}`);
      const lev = ++this.levels[bid];
      this.steps.push({ bid, name: builds[bid].name, lev, cost: this.cost(bid, lev), clout: this.clout(), reason });
    }
    // 補繁榮度：目前可升的建築中，依 優先權重高 > 等級低 > 升級後最貼近目標 > 每單位資源繁榮度高 > bid 小 挑選
    // 「最貼近目標」：能一次補足缺口者中超出最少的優先；都補不足時取增量最大者（離目標最近）
    boostClout(target) {
      const deficit = target - this.clout();
      let best = null, bestKey = null;
      for (const bid of bids) {
        if (bid === MAIN || this.check(bid).length) continue;
        const lev = this.levels[bid];
        const gain = (this.info(bid, lev + 1).Clout || 0) - (this.info(bid, lev).Clout || 0);
        if (gain <= 0) continue;
        const c = this.cost(bid, lev + 1), w = c.Wood + c.Metal + c.Money;
        const fit = gain >= deficit ? gain - deficit : Number.MAX_SAFE_INTEGER - gain;
        const key = [-(this.priority[bid] || 0), lev, fit, -(w === 0 ? Infinity : gain / w), bid];
        if (!bestKey || keyLess(key, bestKey)) { best = bid; bestKey = key; }
      }
      if (best === null) throw new PlanError(`沒有可升級的建築能再提高繁榮度（目前 ${fmt(this.clout())}）`);
      this.upgrade(best, "補繁榮度");
    }
    reach(bid, target, reason = "目標") {
      target = Math.min(target, builds[bid].maxLev);
      while (this.levels[bid] < target) {
        const nxt = this.info(bid, this.levels[bid] + 1);
        for (const r of nxt.UpgradeLimit || [])
          if ((this.levels[r.bid] || 0) < r.lev) this.reach(r.bid, r.lev, "前置");
        while (nxt.CloutLimit && this.clout() < nxt.CloutLimit) this.boostClout(nxt.CloutLimit);
        this.upgrade(bid, reason);
      }
    }
    totalCost() {
      const t = { Wood: 0, Metal: 0, Money: 0 };
      for (const s of this.steps) for (const k of RES) t[k] += s.cost[k];
      return t;
    }
  }

  // ---------- 狀態 ----------
  // 優先升級列永遠顯示的建築：校場、研學館、盾兵營、弓兵營、騎兵營（本地無資料時預設權重 1）
  const PINNED_PRIO = [6, 3, 41, 42, 44];
  let state = { levels: null, stock: { Wood: null, Metal: null, Money: null }, rate: { Wood: null, Metal: null, Money: null },
    selected: MAIN, priority: null };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && saved.levels) state = Object.assign(state, saved);
  } catch (e) {}
  if (!state.priority) state.priority = Object.fromEntries(PINNED_PRIO.map(b => [b, 1]));
  if (!state.rate) state.rate = { Wood: null, Metal: null, Money: null };
  if (state.stockAt == null) state.stockAt = Date.now();   // 庫存最後結算時間（每分鐘依每小時產量累加）
  // 依經過的整分鐘數把產量加進庫存；回傳是否有變動（網頁關閉期間的產出在下次開啟時一次補上）
  function settleStock(now = Date.now()) {
    const mins = Math.floor((now - state.stockAt) / 60000);
    if (mins <= 0) return false;
    let changed = false;
    for (const k of RES) {
      if (state.stock[k] != null && state.rate[k]) { state.stock[k] += state.rate[k] * mins / 60; changed = true; }
    }
    state.stockAt += mins * 60000;
    return changed;
  }
  settleStock();
  // 計算方式：split 分開計算、pooled 總資源量（最快）、lean 最少屯田令；pooled 旗標 = 是否允許用屯田令補足
  if (!["split", "pooled", "lean"].includes(state.calcMode)) state.calcMode = state.pooled ? "pooled" : "split";
  state.pooled = state.calcMode !== "split";
  const CALC_NAME = { split: "分開計算", pooled: "總資源量（最快）", lean: "最少屯田令" };

  // ---------- 屯田（TunTian.lua：上限 10、每 3 小時恢復 1 個、每次消耗 1 個並取得資源點 24 小時產量、每日可買 3 個） ----------
  const HOARD = { cap: 10, recoverMs: 3 * 3600e3, hours: 24, buyPerDay: 3 };
  // s5 資源點每小時產量（ResourceGroundSeason，四種資源點共用），索引 = 等級 0–15
  const RES_GROUND_OUTPUT = [0, 300, 600, 900, 1500, 2100, 2700, 3300, 3900, 4200, 4500, 4800, 5100, 5400, 5700, 6000];
  const DAY_MS = 86400e3, TZ_MS = 8 * 3600e3;
  const dayIndex = ms => Math.floor((ms + TZ_MS) / DAY_MS);          // UTC+8 的日序號
  if (!state.hoard) state.hoard = { count: null, at: null, nextAt: null, buy: false, boughtDay: null,
    lv: 0, union: 0 };
  // 資源點類型可自由轉換，只需一個等級（舊資料為各資源分開的等級，取最高者）
  if (typeof state.hoard.lv === "object") state.hoard.lv = Math.max(0, ...Object.values(state.hoard.lv || {}).map(Number));
  const hoardYield = () => Math.round(RES_GROUND_OUTPUT[state.hoard.lv || 0] * HOARD.hours * (1 + (+state.hoard.union || 0) / 100));
  // 依設定時間推算目前屯田令數量與下一個恢復時間（未滿時每 3 小時 +1）
  function hoardNow(now = Date.now()) {
    const h = state.hoard;
    if (h.count == null) return null;
    let count = h.count, next = h.nextAt;
    if (count < HOARD.cap && next != null && now >= next) {
      const n = Math.floor((now - next) / HOARD.recoverMs) + 1;
      count = Math.min(HOARD.cap, count + n);
      next = count >= HOARD.cap ? null : next + n * HOARD.recoverMs;
    }
    if (count >= HOARD.cap) next = null;
    return { count, next };
  }
  // 從現在起 hours 小時內最多可取得的屯田令（假設在滿額前就使用，恢復不中斷）
  function hoardObtainable(hours, now = Date.now()) {
    const cur = hoardNow(now);
    if (!cur) return null;
    const end = now + hours * 3600e3;
    const first = cur.next != null ? cur.next : now + HOARD.recoverMs;
    const recover = isFinite(hours) && end >= first ? Math.floor((end - first) / HOARD.recoverMs) + 1 : 0;
    let buy = 0;
    if (state.hoard.buy && isFinite(hours)) {
      if (state.hoard.boughtDay !== dayIndex(now)) buy += HOARD.buyPerDay;
      buy += HOARD.buyPerDay * (dayIndex(end) - dayIndex(now));
    }
    return { current: cur.count, recover, buy, total: cur.count + recover + buy };
  }
  // 已設定屯田令數量與資源點等級時，「總資源量（最快）」改為實際使用屯田令加速
  const hoardReady = () => state.hoard.count != null && state.hoard.lv > 0;
  function hoardSimInit() {
    const now = Date.now(), cur = hoardNow(now), h = state.hoard;
    const H = {
      held: cur.count,
      next: cur.next != null ? (cur.next - now) / 3600e3 : null,              // 下一個恢復（滿額時暫停）
      buy: !!h.buy,
      buyLeft: h.buy && h.boughtDay !== dayIndex(now) ? HOARD.buyPerDay : 0,  // 當日剩餘可購買數
      mid: h.buy ? ((dayIndex(now) + 1) * DAY_MS - TZ_MS - now) / 3600e3 : Infinity,  // 下一個 UTC+8 0 時
      used: 0, bought: 0,
    };
    if (H.held < HOARD.cap && H.next == null) H.next = HOARD.recoverMs / 3600e3;
    return H;
  }
  function hoardAdvance(H, T) {
    for (;;) {
      const ev = Math.min(H.next == null ? Infinity : H.next, H.mid);
      if (ev > T) return;
      if (H.next != null && ev === H.next) {
        H.held++;
        H.next = H.held >= HOARD.cap ? null : H.next + HOARD.recoverMs / 3600e3;
      } else { H.buyLeft = HOARD.buyPerDay; H.mid += 24; }
    }
  }
  function hoardTake(H, T) {
    hoardAdvance(H, T);
    if (H.held > 0) {
      H.held--; H.used++;
      if (H.next == null) H.next = T + HOARD.recoverMs / 3600e3;           // 低於上限後重新開始恢復
      return true;
    }
    if (H.buyLeft > 0) { H.buyLeft--; H.bought++; H.used++; return true; }
    return false;
  }
  const hoardNextEvent = H => Math.min(H.next == null ? Infinity : H.next, H.buy ? H.mid : Infinity);
  // 最激進的屯田策略：缺哪種資源就立刻用屯田令（含當日購買額度）補，仍不足才等待產出或下一個屯田令
  function tokenStep(st, S, R, H, t, Y) {
    let el = 0;
    const add = { Wood: 0, Metal: 0, Money: 0 }, use = { Wood: 0, Metal: 0, Money: 0 };
    const short = k => st.cost[k] - (S[k] + R[k] * el + add[k]);
    for (let guard = 0; guard < 10000; guard++) {
      for (;;) {
        const k = RES.filter(x => short(x) > 1e-6).sort((a, b) => short(b) - short(a))[0];
        if (!k || !hoardTake(H, t + el)) break;
        add[k] += Y; use[k]++;
      }
      if (!RES.some(x => short(x) > 1e-6)) break;
      let wProd = 0, lack = null;
      for (const x of RES) {
        const v = short(x);
        if (v <= 1e-6) continue;
        if (R[x] <= 0) { wProd = Infinity; lack = x; break; }
        wProd = Math.max(wProd, v / R[x]);
      }
      hoardAdvance(H, t + el);
      const ev = hoardNextEvent(H) - (t + el);
      if (ev < wProd) { el += Math.max(0, ev); continue; }
      if (!isFinite(wProd)) return { wait: Infinity, lack };
      el += wProd;
      break;
    }
    hoardAdvance(H, t + el);
    return { wait: el, add, use };
  }
  const fmtClock = ms => {
    const t = Math.max(0, Math.round(ms / 1000)), hh = Math.floor(t / 3600), mm = Math.floor(t % 3600 / 60), ss = t % 60;
    return `${hh}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  };
  function renderHoardChip() {
    const cur = hoardNow();
    $("hoardCnt").textContent = cur ? cur.count : "–";
    $("hoardTimer").textContent = !cur ? "未設定" : cur.next == null ? "已滿" : fmtClock(cur.next - Date.now());
  }
  // 規劃結果的屯田建議
  function hoardAdvice(steps, tl) {
    const h = state.hoard;
    if (h.count == null && !h.lv) return `<div class="note-sm">點頂欄「屯田令」設定數量與資源點等級，可估算屯田能補多少資源並建議使用時機。</div>`;
    const ob = hoardObtainable(tl.hours);
    const y = Object.fromEntries(RES.map(k => [k, hoardYield()]));
    let html = `<div class="eval"><h4>屯田建議</h4><div>每次屯田可得：${y.Wood ? `<b>${fmt(y.Wood)}</b>（Lv${h.lv} 資源點，轉換為所需的資源類型）` : "—（未設定資源點等級）"}${h.union ? `，含聯盟加成 ${h.union}%` : ""}</div>`;
    if (ob) html += `<div>完成前可取得屯田令：<b>${isFinite(ob.total) ? ob.total : "—"}</b> 個（目前 ${ob.current} + 恢復 ${ob.recover}${h.buy ? ` + 購買 ${ob.buy}` : ""}）</div>`;
    const need = RES.filter(k => tl.items[k] > 0);
    if (tl.tokenModel) {
      const rows = steps.map((st, i) => ({ st, i, use: tl.trace[i].hoard })).filter(r => r.use && RES.some(k => r.use[k]));
      html += rows.length ? `<div class="scroll" style="margin-top:6px"><table><thead><tr><th>時機</th><th>升級</th><th>屯田</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${fmtAt(tl.at[r.i])}</td><td>第 ${r.i + 1} 步 ${esc(r.st.name)} Lv${r.st.lev} 之前</td>
          <td>${RES.filter(k => r.use[k]).map(k => `${RES_NAME[k]} ${r.use[k]} 次`).join("、")}</td></tr>`).join("")}
        </tbody></table></div>` : `<div>這條路徑不需要屯田。</div>`;
    } else if (state.pooled && need.length) {
      // 依缺口開始的時間排序，逐一分配屯田令
      const rows = need.map(k => {
        const first = tl.trace.findIndex(tr => tr.stock && tr.stock[k] < -1);   // 忽略剛好用完時的浮點誤差
        return { k, first, last: tl.lowAt[k], times: y[k] ? Math.ceil(tl.items[k] / y[k]) : Infinity };
      }).sort((a, b) => a.first - b.first);
      let used = 0;
      html += `<div class="scroll" style="margin-top:6px"><table><thead><tr><th>資源</th><th class="r">缺口</th><th class="r">需屯田</th><th>開始缺（建議在此之前屯田）</th><th>最遲補足</th><th>屯田令</th></tr></thead><tbody>`;
      for (const r of rows) {
        const sf = steps[r.first], sl = steps[r.last];
        used += r.times;
        const avail = ob ? hoardObtainable(tl.at[r.last]) : null;
        const ok = avail && isFinite(r.times) && used <= avail.total;
        html += `<tr><td>${RES_NAME[r.k]}</td><td class="r num">${fmt(tl.items[r.k])}</td>
          <td class="r">${isFinite(r.times) ? `${r.times} 次` : "未設定資源點"}</td>
          <td>第 ${r.first + 1} 步 ${esc(sf.name)} Lv${sf.lev}（${fmtAt(tl.at[r.first])}）</td>
          <td>第 ${r.last + 1} 步 ${esc(sl.name)} Lv${sl.lev}（${fmtAt(tl.at[r.last])}）</td>
          <td class="${!avail ? "" : ok ? "ok" : "bad"}">${!avail ? "未設定數量" : ok ? `夠用（累計 ${used}/${avail.total}）` : `不足 ${used - avail.total} 個`}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      if (ob && used > ob.total) html += `<div class="bad">屯田令不夠補足全部缺口，可改用「分開計算」等資源自然恢復，或增加購買。</div>`;
    } else if (!state.pooled) {
      const total = RES.reduce((a, k) => a + tl.waitBy[k], 0);
      const top = RES.reduce((a, k) => tl.waitBy[k] > tl.waitBy[a] ? k : a, "Wood");
      html += total > 0
        ? `<div>等待時間主要卡在 <b class="bad">${RES_NAME[top]}</b>（${fmtHours(tl.waitBy[top])}，佔 ${Math.round(tl.waitBy[top] / total * 100)}%）。建議屯田時把資源點轉換為${RES_NAME[top]}${y[top] ? `，每次約可少等 ${fmtHours(y[top] / Math.max(1, tl.rate[top]))}` : ""}。</div>`
        : `<div>目前庫存足夠，不需要等待，也不需要屯田。</div>`;
    } else html += `<div>這條路徑不需要用屯田令補足。</div>`;
    return html + `<div class="note-sm">屯田令以「滿額前就使用、恢復不中斷」估算；超過倉庫上限的屯田收益遊戲中會無法取得。</div></div>`;
  }
  const prioOf = bid => +state.priority[bid] || 0;
  // 優先升級建築：固定建築（含權重 0）與其他權重 > 0 的建築，權重高者在前，同權重依固定順序
  const prioList = () => {
    const order = b => { const i = PINNED_PRIO.indexOf(b); return i < 0 ? PINNED_PRIO.length + b : i; };
    return bids.filter(b => PINNED_PRIO.includes(b) || prioOf(b) > 0).sort((a, b) => prioOf(b) - prioOf(a) || order(a) - order(b));
  };
  let sim = new Sim(state.levels);
  let lastPlan = null;

  // 手機版頂欄收起／展開（記在本機設定）
  const syncFold = () => {
    $("topbar").classList.toggle("folded", !!state.topFold);
    $("topFold").textContent = state.topFold ? "展開 ▼" : "收起 ▲";
    $("topFold").setAttribute("aria-expanded", String(!state.topFold));
  };
  $("topFold").addEventListener("click", () => { state.topFold = !state.topFold; save(); syncFold(); });
  syncFold();
  function save() {
    state.levels = { ...sim.levels };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  // 庫存與回復速度的輸入皆以「萬」為單位
  function parseWan(s) {
    s = String(s || "").trim().replace(/,/g, "").replace(/萬$/, "");
    if (!s || !/^\d*\.?\d+$/.test(s)) return null;
    return Math.round(parseFloat(s) * 10000);
  }
  const toWan = n => String(Math.round(n) / 10000);   // 保留到個位數，避免來回轉換失真
  const hasStock = () => RES.some(k => state.stock[k] != null);
  const hasEconomy = () => RES.some(k => state.stock[k] != null || state.rate[k] != null);

  // 被動生產升級資源的建築（每小時產量 = ResOutput × 60）；磨坊產糧草，不影響升級
  const PRODUCERS = { 48: "Wood", 47: "Metal", 14: "Money" };
  const hourly = (bid, lev) => (builds[bid].levels[lev].ResOutput || 0) * 60;
  // 表示「何時」的時間：依切換顯示為剩餘時間（約 X 後）或實際時間點（月/日 時:分）；時長差值仍用 fmtHours
  function fmtAt(h, short) {
    if (!isFinite(h)) return "無法完成";
    if (!state.timeAbs) return h < 1 / 60 ? "現在" : short ? fmtHours(h, true) : `約 ${fmtHours(h)} 後`;
    const d = new Date(Date.now() + h * 3600e3), pad = n => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtHours(h, short) {
    if (!isFinite(h)) return "無法完成";
    if (h < 1 / 60) return short ? "立即" : "立即完成";
    if (h < 1) return Math.ceil(h * 60) + (short ? "分" : " 分鐘");
    if (h < 24) return (Math.round(h * 10) / 10) + (short ? "時" : " 小時");
    const hh = Math.round(h), d = Math.floor(hh / 24), r = hh - d * 24;   // 先進位到整點，避免出現「7 天 24 小時」
    return short ? `${d}天${r}時` : `${d} 天 ${r} 小時`;
  }
  // 依目前庫存與每小時回復量，計算每一步可執行的時間點（升級瞬間完成；產能建築升級後提高回復量）
  // pooled：只要三種資源合計足夠即可升級，個別資源的缺口記為需用屯田令補足的量
  // lean：先以 pooled 求出最快完成時間作為期限，每一步等到資源各自足夠才升，期限到時才用屯田令補足
  function timeline(steps, mode = state.calcMode) {
    if (mode !== "lean") return simulate(steps, mode, Infinity);
    const fast = simulate(steps, "pooled", Infinity);
    const lean = simulate(steps, "lean", fast.hours);
    lean.fast = fast;
    return lean;
  }
  function simulate(steps, mode, deadline) {
    const S = {}, R = {}, low = {}, lowAt = {}, trace = [], waitBy = {};
    for (const k of RES) { S[k] = state.stock[k] || 0; R[k] = state.rate[k] || 0; low[k] = 0; lowAt[k] = -1; waitBy[k] = 0; }
    const sum = o => RES.reduce((a, k) => a + o[k], 0);
    const tokenModel = mode === "pooled" && hoardReady();
    const H = tokenModel ? hoardSimInit() : null, Y = tokenModel ? hoardYield() : 0;
    let t = 0, blocked = null;
    const at = [];
    for (const st of steps) {
      let wait = 0, add = null, use = null;
      if (tokenModel) {
        const r = tokenStep(st, S, R, H, t, Y);
        wait = r.wait; add = r.add; use = r.use;
        if (!isFinite(wait)) blocked = blocked || r.lack;
      } else if (mode === "pooled") {
        const need = sum(st.cost) - sum(S);
        if (need > 0) wait = sum(R) > 0 ? need / sum(R) : Infinity;
        if (!isFinite(wait)) blocked = blocked || "all";
      } else {
        let split = 0, lack = null, limit = null;
        for (const k of RES) {
          const need = st.cost[k] - S[k];
          if (need <= 0) continue;
          if (R[k] <= 0) { split = Infinity; lack = lack || k; break; }
          if (need / R[k] > split) { split = need / R[k]; limit = k; }
        }
        wait = mode === "lean" ? Math.max(0, Math.min(t + split, deadline) - t) : split;
        if (!isFinite(wait)) blocked = blocked || lack;
        else if (limit) waitBy[limit] += wait;
      }
      if (!isFinite(wait)) { t = Infinity; at.push(Infinity); trace.push({ wait: Infinity }); continue; }
      t += wait;
      for (const k of RES) {
        S[k] += R[k] * wait + (add ? add[k] : 0) - st.cost[k];
        if (S[k] < low[k] && S[k] < -1) { low[k] = S[k]; lowAt[k] = at.length; }
      }
      const res = PRODUCERS[st.bid];
      if (res) R[res] += hourly(st.bid, st.lev) - hourly(st.bid, st.lev - 1);
      at.push(t);
      trace.push({ wait, t, stock: { ...S }, rate: { ...R }, hoard: use });
    }
    const items = {};
    for (const k of RES) items[k] = Math.max(0, Math.round(-low[k]));
    return { hours: t, at, blocked, stock: S, rate: R, items, lowAt, trace, waitBy,
      tokenModel, tokensUsed: H ? H.used : 0, bought: H ? H.bought : 0, hoardEnd: H && { held: H.held, next: H.next } };
  }
  const affordable = c => {
    if (!state.pooled) return RES.every(k => state.stock[k] == null || state.stock[k] >= c[k]);
    if (!hasStock()) return true;
    return RES.reduce((a, k) => a + (state.stock[k] || 0), 0) >= c.Wood + c.Metal + c.Money;
  };

  // ---------- 繪製 ----------
  function labelHtml(bid) {
    const b = builds[bid], lev = sim.levels[bid];
    if (lev >= b.maxLev) return `<span class="lv">${lev}/${b.maxLev}</span><span class="max">MAX</span>`;
    const blocked = sim.check(bid).length > 0;
    const canPay = affordable(sim.cost(bid, lev + 1));
    return `<span class="lv"><i class="${blocked ? "red" : ""}">${lev}</i>/${b.maxLev}</span>${!blocked && canPay ? '<span class="up">↑</span>' : ""}`;
  }
  function cardHtml(bid) {
    const b = builds[bid];
    return `<button class="card${bid === state.selected ? " sel" : ""}${sim.levels[bid] === 0 ? " lock" : ""}" data-bid="${bid}">
      <div class="plate"><div class="house"><b>${esc(b.name[0])}</b></div></div>
      <div class="label">${prioOf(bid) ? `<span class="prio-badge" title="優先權重 ${prioOf(bid)}">優${prioOf(bid)}</span>` : ""}${esc(b.name)} ${labelHtml(bid)}</div></button>`;
  }
  function renderTiers() {
    // 君主殿置於最上方中間；演武堂等單級建築不顯示（繁榮度仍計入總繁榮度）
    $("tiers").innerHTML = `<div class="tier top">${cardHtml(MAIN)}</div>` +
      LAYOUT.map(r => `<div class="tier"><div class="tier-mark"><span><b>${r.tier}</b></span></div>
      ${r.bids.map(cardHtml).join("")}</div>`).join("");
  }
  function renderSummary() {
    const main = builds[MAIN], ml = sim.levels[MAIN];
    const next = ml < main.maxLev ? main.levels[ml + 1].CloutLimit : null;
    $("summary").innerHTML = `
      <div class="chip"><div class="k">${esc(main.name)}</div><div class="v num">Lv ${ml} / ${main.maxLev}</div></div>
      <div class="chip"><div class="k">總繁榮度${next ? `（下一級需 ${fmt(next)}）` : ""}</div><div class="v num ${next && sim.clout() < next ? "bad" : ""}">${fmt(sim.clout())}</div></div>
      <div class="chip"><div class="k">建築戰鬥力</div><div class="v num">${fmt(sim.power())}</div></div>`;
    const list = prioList();
    $("prio").innerHTML = `<span class="prio-title">優先升級</span>` +
      list.map(bid => {
        const pinned = PINNED_PRIO.includes(bid);
        return `<span class="prio-item${prioOf(bid) ? "" : " zero"}"><button class="prio-name" data-sel="${bid}">${esc(builds[bid].name)}</button>
          <input type="number" min="0" max="99" value="${prioOf(bid)}" data-prio="${bid}" title="優先權重，0 = 不優先">
          ${pinned ? "" : `<button class="prio-del" data-prio-del="${bid}" title="移除">×</button>`}</span>`;
      }).join("") +
      `<span class="prio-empty" title="補繁榮度時先升權重高的建築，其餘建築從等級最低的開始；同等級時挑升級後最貼近門檻的。其他建築可在右側面板設定權重後加入。">權重越大越先升，0 = 不優先</span>`;
  }
  function prow(icon, k, v) {
    return `<div class="prow"><div class="ic">${icon}</div><div class="k">${k}</div><div class="v num">${v}</div></div>`;
  }
  function renderPanel() {
    const bid = state.selected, b = builds[bid], lev = sim.levels[bid];
    const full = lev >= b.maxLev, cur = b.levels[lev], nxt = full ? null : b.levels[lev + 1];
    const arrow = (a, c) => full ? fmt(a) : `${fmt(a)}<span class="arrow">»</span>${fmt(c)}`;
    let rows = prow("級", "等級", full ? `${lev}（已滿級）` : `${lev}<span class="arrow">»</span>${lev + 1}`);
    if (bid === MAIN) rows += prow("榮", "繁榮度", full ? fmt(sim.clout()) : `${fmt(sim.clout())}<span class="ok"> +${fmt((nxt.Clout || 0) - (cur.Clout || 0))}</span>`);
    else rows += prow("榮", "繁榮度", arrow(cur.Clout || 0, nxt && nxt.Clout || 0));
    // 只保留兵營的兵階（Level）與軍事府的帶兵數（SoldierNum）
    if (CAMPS.includes(bid)) rows += prow("階", "兵階等級", arrow(cur.Level || 0, nxt && nxt.Level || 0));
    if (bid === ARMY) rows += prow("兵", "部隊帶兵數", arrow(cur.SoldierNum || 0, nxt && nxt.SoldierNum || 0));
    let costRows = "", warn = "", canUp = false;
    if (!full) {
      const c = sim.cost(bid, lev + 1);
      const resHtml = RES.filter(k => c[k]).map(k => {
        const okk = state.stock[k] == null || state.stock[k] >= c[k];
        return `<span class="${state.stock[k] == null ? "" : okk ? "ok" : "bad"}">${RES_ICON[k]} ${fmt(c[k])}</span>`;
      }).join("　") || "無";
      costRows += prow("資", "資源需求", resHtml);
      if (nxt.CloutLimit) {
        const okc = sim.clout() >= nxt.CloutLimit;
        costRows += prow("榮", "繁榮度需求", `<span class="${okc ? "ok" : "bad"}">${fmt(sim.clout())}</span> / ${fmt(nxt.CloutLimit)}`);
      }
      for (const r of nxt.UpgradeLimit || []) {
        const okr = (sim.levels[r.bid] || 0) >= r.lev;
        costRows += prow("前", esc(builds[r.bid].name), `<span class="${okr ? "ok" : "bad"}">${sim.levels[r.bid] || 0}</span> / ${r.lev}`);
      }
      const reasons = sim.check(bid);
      if (reasons.length) warn = reasons.join("、");
      else if (!affordable(c)) warn = "資源不足，請先獲取資源";
      canUp = !reasons.length && affordable(c);
    }
    $("panel").innerHTML = `
      <h2>${esc(b.name)}</h2><div class="divider"></div>
      ${rows}
      ${full ? "" : `<div class="sect">升級消耗</div>${costRows}`}
      <div class="warn">${esc(warn)}</div>
      <button class="btn cream" id="upBtn" ${canUp ? "" : "disabled"}>升　級</button>
      <div class="plan-ctl">
        <span style="color:var(--muted);font-size:14px">規劃升到</span>
        <input type="number" id="planLev" min="1" max="${b.maxLev}" value="${planLevMemo[bid] ?? b.maxLev}">
        <span style="color:var(--muted);font-size:14px">級</span>
        <button class="btn gold" id="planBtn">計算路徑</button>
      </div>
      ${bid === MAIN ? "" : `<div class="plan-ctl">
        <span style="color:var(--muted);font-size:14px">優先權重</span>
        <input type="number" min="0" max="99" value="${prioOf(bid)}" data-prio="${bid}">
        <span style="color:var(--muted);font-size:12px">0 = 不優先，數字越大越先升</span>
      </div>`}`;
  }
  function renderInputs() {
    for (const k of RES) {
      const inp = $("st" + k), rt = $("rt" + k);
      if (document.activeElement !== inp) inp.value = state.stock[k] == null ? "" : toWan(state.stock[k]);
      if (document.activeElement !== rt) rt.value = state.rate[k] == null ? "" : toWan(state.rate[k]);
    }
  }
  function render() {
    renderSummary(); renderTiers(); renderPanel(); renderInputs();
  }
  const planLevMemo = {};   // 各建築「規劃升到」輸入的值
  document.addEventListener("input", e => { if (e.target.id === "planLev") planLevMemo[state.selected] = +e.target.value || undefined; });
  // 每分鐘結算後只更新受庫存影響的部分；使用者正在操作右側面板時不重繪面板
  function refreshEconomy() {
    renderSummary(); renderTiers(); renderInputs();
    if (!$("panel").contains(document.activeElement)) renderPanel();
  }

  function makePlan(bid, target, priority) {
    const p = new Sim(sim.levels, priority);
    let err = null;
    try { p.reach(bid, target); } catch (e) { if (e instanceof PlanError) err = e.message; else throw e; }
    return { p, err, tl: hasEconomy() ? timeline(p.steps) : null };
  }
  // 產能建築評估：比較「設為最優先」與「不設優先」時，達成目標所需的總時間；
  // 以總資源量計算時，三種產出對合計的影響相同，改以「需用屯田令的量」一併比較
  function evaluateProducers(bid, target, base) {
    const top = Math.min(99, Math.max(0, ...Object.values(state.priority).map(Number)) + 1);
    const pooled = state.pooled, tokenModel = !!(base.tl && base.tl.tokenModel);
    const itemSum = tl => tokenModel ? tl.tokensUsed : RES.reduce((a, k) => a + tl.items[k], 0);
    const wanShort = tokenModel ? n => `${n} 次` : n => (Math.round(n / 1000) / 10) + "萬";
    const rows = [];
    for (const pb of Object.keys(PRODUCERS).map(Number)) {
      const lv = sim.levels[pb];
      if (lv >= builds[pb].maxLev || pb === bid) continue;
      const withP = makePlan(bid, target, { ...state.priority, [pb]: top });
      const without = { ...state.priority }; delete without[pb];
      const noP = makePlan(bid, target, without);
      const tw = withP.tl.hours, tn = noP.tl.hours;
      const iw = itemSum(withP.tl), inn = itemSum(noP.tl);
      const gain = hourly(pb, lv + 1) - hourly(pb, lv);
      const dt = tn - tw, di = pooled ? inn - iw : 0;          // 正值 = 設為最優先較好
      const tTxt = dt > 0 ? `省 ${fmtHours(dt)}` : `多 ${fmtHours(-dt)}`;
      const iTxt = di > 0 ? `屯田少 ${wanShort(di)}` : `屯田多 ${wanShort(-di)}`;
      const tSig = Math.abs(dt) > 0.05 ? Math.sign(dt) : 0, iSig = Math.abs(di) >= (tokenModel ? 1 : 1000) ? Math.sign(di) : 0;
      let verdict, cls = "";
      if (!isFinite(tw) && !isFinite(tn)) verdict = "無法完成";
      else if (tSig >= 0 && iSig >= 0 && tSig + iSig > 0) {
        verdict = `划算，${[tSig ? tTxt : "", iSig ? iTxt : ""].filter(Boolean).join("、")}`; cls = "good";
      } else if (tSig <= 0 && iSig <= 0 && tSig + iSig < 0) {
        verdict = `不划算，${[tSig ? tTxt : "", iSig ? iTxt : ""].filter(Boolean).join("、")}`; cls = "bad";
      } else if (!tSig && !iSig) verdict = "差不多";
      else { verdict = `${tTxt}，但${iTxt}`; cls = "mixed"; }  // 時間與屯田令一好一壞，由玩家取捨
      rows.push(`<tr><td>${esc(builds[pb].name)}</td><td>${RES_NAME[PRODUCERS[pb]]}</td><td>Lv${lv}</td><td class="r num">+${fmt(gain)}/時</td>
        <td class="r">${fmtAt(tw)}${pooled ? `<br><small>屯田 ${wanShort(iw)}</small>` : ""}</td>
        <td class="r">${fmtAt(tn)}${pooled ? `<br><small>屯田 ${wanShort(inn)}</small>` : ""}</td><td class="${cls}">${verdict}</td>
        <td>${prioOf(pb) ? `<button class="btn" data-eval-prio="${pb}" data-w="0">取消優先</button>` : ""}
          ${(cls === "good" || cls === "mixed") && prioOf(pb) !== top ? `<button class="btn gold" data-eval-prio="${pb}" data-w="${top}">設為最優先</button>` : ""}</td></tr>`);
    }
    if (!rows.length) return "";
    return `<div class="eval"><h4>產能建築評估</h4>
      <div class="scroll"><table><thead><tr><th>建築</th><th>產出</th><th>目前</th><th class="r">下一級增產</th>
        <th class="r">設為最優先</th><th class="r">不設優先</th><th>結論</th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">比較達成目標${state.timeAbs ? "的完成時間" : "所需的總時間"}${pooled ? "與需用屯田令的量" : ""}（目前設定：${fmtAt(base.tl.hours)}${pooled ? `，屯田 ${wanShort(itemSum(base.tl))}` : ""}）。產能建築升級後，每小時回復量會跟著提高。</div></div>`;
  }
  let lastPlanArgs = null, lastDebugPlan = null;
  function runPlan(bid = state.selected, target = +$("planLev").value) {
    lastPlanArgs = [bid, target];
    const plan = makePlan(bid, target, state.priority), { p, err, tl } = plan;
    lastPlan = p; lastPlan.tl = tl;
    lastDebugPlan = { bid, target, steps: p.steps, tl, err };
    logPlan();
    const total = p.totalCost();
    const totalAll = total.Wood + total.Metal + total.Money;
    const top = RES.reduce((a, k) => total[k] > total[a] ? k : a, "Wood");
    let lack;
    if (state.pooled) {
      const have = RES.reduce((a, k) => a + (state.stock[k] || 0), 0);
      lack = hasStock() && have < totalAll ? [`合計差 ${fmt(totalAll - have)}`] : [];
    } else {
      lack = RES.filter(k => state.stock[k] != null && state.stock[k] < total[k])
        .map(k => `${RES_NAME[k]}差 ${fmt(total[k] - state.stock[k])}`);
    }
    let timeInfo = "";
    if (tl) {
      timeInfo = isFinite(tl.hours)
        ? `<div>${state.timeAbs ? `預計完成 <b class="ok">${fmtAt(tl.hours)}</b>（耗時 ${fmtHours(tl.hours)}，` : `預計耗時 <b class="ok">${fmtHours(tl.hours)}</b>（`}依目前庫存與每小時回復量，${CALC_NAME[state.calcMode]}）</div>`
        : `<div class="bad">${tl.blocked === "all" ? "資源合計" : RES_NAME[tl.blocked]}不足且沒有回復量，無法完成。請輸入每小時回復量。</div>`;
      const need = RES.filter(k => tl.items[k] > 0);
      if (tl.tokenModel && isFinite(tl.hours)) {
        // 對照「最少屯田令」：同一條路徑、同樣在此時間完成，只在期限到時才屯田（缺口換算成次數）
        const lean = timeline(p.steps, "lean"), Yd = hoardYield();
        const leanTimes = RES.reduce((a, k) => a + Math.ceil(lean.items[k] / Yd), 0);
        const diff = tl.tokensUsed - leanTimes;
        timeInfo += `<div style="color:var(--gold)">使用屯田 <b>${tl.tokensUsed}</b> 次${tl.bought ? `（其中購買 ${tl.bought} 個）` : ""}，每次 ${fmt(Yd)}，完成時剩屯田令 ${tl.hoardEnd.held} 個
          <div style="color:var(--muted);font-size:12px">缺哪種資源就立刻屯田補上，屯田令不夠才等待產出或恢復。
          對照（同一條路徑）：最少屯田令 ${leanTimes} 次、${state.timeAbs ? fmtAt(lean.hours) : fmtHours(lean.hours)}${diff > 0 ? `，改用最少屯田令可少屯 <b style="color:var(--green)">${diff}</b> 次` : diff < 0 ? `，反而要多屯 ${-diff} 次（目前的屯田方式已是最少）` : "，次數相同"}</div></div>`;
      } else if (state.pooled && isFinite(tl.hours)) {
        // 對照兩種用屯田令的方式（同一條路徑）
        const fast = tl.fast || timeline(p.steps, "pooled"), lean = state.calcMode === "lean" ? tl : timeline(p.steps, "lean");
        const tot = x => RES.reduce((a, k) => a + x.items[k], 0);
        if (fast.tokenModel) {
          // 已設定屯田：以屯田次數比較（最少屯田令的缺口換算成次數）
          const Yd = hoardYield(), leanTimes = RES.reduce((a, k) => a + Math.ceil(lean.items[k] / Yd), 0);
          timeInfo += `<div style="color:var(--muted);font-size:12px">對照（同一條路徑）：總資源量（最快）屯田 ${fast.tokensUsed} 次、${state.timeAbs ? fmtAt(fast.hours) : fmtHours(fast.hours)}；
            最少屯田令 ${leanTimes} 次、${state.timeAbs ? fmtAt(lean.hours) : fmtHours(lean.hours)}${fast.tokensUsed > leanTimes ? `，可少屯 <b style="color:var(--green)">${fast.tokensUsed - leanTimes}</b> 次` : ""}</div>`;
        } else
        timeInfo += `<div style="color:var(--muted);font-size:12px">對照（同一條路徑）：總資源量（最快）屯田令 ${fmt(tot(fast))}、${state.timeAbs ? fmtAt(fast.hours) : fmtHours(fast.hours)}；
          最少屯田令 ${fmt(tot(lean))}、${state.timeAbs ? fmtAt(lean.hours) : fmtHours(lean.hours)}${tot(fast) > tot(lean) ? `，可少用 <b style="color:var(--green)">${fmt(tot(fast) - tot(lean))}</b>` : ""}</div>`;
      }
      if (state.pooled && isFinite(tl.hours) && need.length)
        timeInfo += `<div style="color:var(--gold)">${state.calcMode === "lean" ? "需用屯田令補足" : "途中需用屯田令補足（最大缺口）"}：${need.map(k => {
            const i = tl.lowAt[k], st = p.steps[i];
            return `${RES_NAME[k]} ${fmt(tl.items[k])}<small style="color:var(--muted)">（第 ${i + 1} 步 ${esc(st.name)} Lv${st.lev}）</small>`;
          }).join("、")}
          <div style="color:var(--muted);font-size:12px">${state.calcMode === "lean"
            ? "每一步等到資源各自足夠才升級，只在期限（與最快方式同時完成）到時才用屯田令補足。"
            : "缺口發生在途中；補足後產出會繼續累積，所以完成時仍可能有剩餘。"}完成時剩餘：${RES.map(k => `${RES_NAME[k]} ${fmt(Math.round(tl.stock[k] + tl.items[k]))}`).join("、")}</div></div>`;
    }
    const share = k => totalAll ? Math.round(total[k] / totalAll * 100) : 0;
    const topInfo = totalAll ? `<div>消耗最大：<b class="bad">${RES_NAME[top]} ${fmt(total[top])}</b>（佔 ${share(top)}%；${RES.filter(k => k !== top).map(k => `${RES_NAME[k]} ${share(k)}%`).join("、")}）</div>` : "";
    $("planTitle").textContent = `升級路徑：${builds[bid].name} → Lv${Math.min(target, builds[bid].maxLev)}`;
    $("planInfo").innerHTML = `${err ? `<div class="bad">規劃中斷：${esc(err)}</div>` : ""}
      共 <b>${p.steps.length}</b> 步　總消耗 ${RES.map(k => `${RES_NAME[k]} <b class="num">${fmt(total[k])}</b>`).join("　")}
      　完成後繁榮度 ${fmt(p.clout())}${topInfo}${!tl && lack.length ? `<div class="bad">庫存不足：${lack.join("、")}</div>` : ""}${timeInfo}
      ${tl && isFinite(tl.hours) ? hoardAdvice(p.steps, tl) : ""}
      ${tl ? evaluateProducers(bid, target, plan) : `<div style="color:var(--muted);font-size:12px;margin-top:4px">在頂欄輸入庫存與每小時回復量（萬），可估算耗時並評估產能建築是否划算。</div>`}`;
    $("planSteps").innerHTML = p.steps.length ? `<table><thead><tr><th>#</th><th>建築</th><th>Lv</th><th>原因</th>
      ${RES.map(k => `<th class="r">${RES_NAME[k]}</th>`).join("")}<th class="r">繁榮度</th>${tl ? '<th class="r">時間點</th>' : ""}${tl && tl.tokenModel ? "<th>升級前屯田</th>" : ""}</tr></thead><tbody>
      ${p.steps.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${s.lev}</td><td class="reason-${s.reason}">${s.reason}</td>
        ${RES.map(k => `<td class="r num">${fmt(s.cost[k])}</td>`).join("")}<td class="r num">${fmt(s.clout)}</td>
        ${tl ? `<td class="r">${fmtAt(tl.at[i], true)}</td>` : ""}${tl && tl.tokenModel ? `<td class="hoard-cell">${(u => u ? RES.filter(k => u[k]).map(k => `${RES_ICON[k]}×${u[k]}`).join(" ") : "")(tl.trace[i].hoard)}</td>` : ""}</tr>`).join("")}
      </tbody></table>` : "";
    $("applyPlan").disabled = !p.steps.length;
    $("planBox").hidden = false;
    $("planBox").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function spend(c) {
    for (const k of RES) if (state.stock[k] != null) state.stock[k] = Math.max(0, state.stock[k] - c[k]);
  }
  function addProduction(bid, lev) {
    const res = PRODUCERS[bid];
    if (res && state.rate[res] != null) state.rate[res] += hourly(bid, lev) - hourly(bid, lev - 1);
  }

  // ---------- 事件 ----------
  $("tiers").addEventListener("click", e => {
    const card = e.target.closest("[data-bid]");
    if (!card) return;
    state.selected = +card.dataset.bid; save(); renderTiers(); renderPanel();
  });
  $("panel").addEventListener("click", e => {
    if (e.target.id === "upBtn") {
      const bid = state.selected;
      try {
        sim.upgrade(bid, "手動");
        settleStock();
        spend(sim.steps[sim.steps.length - 1].cost); addProduction(bid, sim.levels[bid]); save(); render();
      }
      catch (err) { if (!(err instanceof PlanError)) throw err; }
    } else if (e.target.id === "planBtn") runPlan();
  });
  function setPriority(bid, w) {
    w = Math.max(0, Math.min(99, Math.round(+w || 0)));
    if (w) state.priority[bid] = w; else delete state.priority[bid];
    save(); renderSummary(); renderTiers(); renderPanel();
  }
  document.addEventListener("change", e => {
    const p = e.target.closest("[data-prio]");
    if (p) setPriority(+p.dataset.prio, p.value);
  });
  $("prio").addEventListener("click", e => {
    const del = e.target.closest("[data-prio-del]"), sel = e.target.closest("[data-sel]");
    if (del) setPriority(+del.dataset.prioDel, 0);
    else if (sel) { state.selected = +sel.dataset.sel; save(); renderTiers(); renderPanel(); }
  });
  for (const k of RES) {
    $("st" + k).addEventListener("change", e => { settleStock(); state.stock[k] = parseWan(e.target.value); state.stockAt = Date.now(); save(); render(); });
    $("rt" + k).addEventListener("change", e => { settleStock(); state.rate[k] = parseWan(e.target.value); save(); render(); });
  }
  $("calcMode").value = state.calcMode;
  $("calcMode").addEventListener("change", e => {
    state.calcMode = e.target.value; state.pooled = state.calcMode !== "split"; save(); render();
    if (!$("planBox").hidden && lastPlanArgs) runPlan(...lastPlanArgs);
  });
  // ---------- 分享設定：以網址 #s=<base64url(JSON)> 傳遞，不含截圖；若已算出路徑一併記錄 ----------
  const SHARE_VER = 1;
  const b64enc = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64dec = str => decodeURIComponent(escape(atob(str.replace(/-/g, "+").replace(/_/g, "/"))));
  function sharePayload() {
    const h = state.hoard;
    return {
      v: SHARE_VER, levels: { ...sim.levels }, stock: state.stock, stockAt: state.stockAt, rate: state.rate,

    status.textContent = restoredNote + (reason ? "找不到建築標籤，可下載辨識引擎再試，或手動輸入。"

  // 有不確定的項目或解析度太低時：引擎已就緒就直接辨識，曾同意下載則自動下載
  // 帶出上次的截圖只是方便對照，不自動執行引擎（避免每次打開視窗都在手機上重跑），改由提示列的按鈕手動執行
  function startEngine(job) {
    renderEngine();
    if (!wantEngine(job) || job.restored) return;
    if (engine.state === "ready") recognizeAll(job);
    else if (engine.state === "loading") $("ocrStatus").textContent = "等待辨識引擎下載完成…";

  // 只辨識指定區域：各區域裁切後縮放到基準高度（1040）再一起送進引擎，不跑整張截圖；
  // 回傳各區域的文字行（座標換回原圖）
  async function paddleRead(img, rects) {
    const k = Math.min(3, OCR_HEIGHT / img.height);
    const crops = rects.map(r => {
      const x0 = Math.max(0, Math.floor(r[0])), y0 = Math.max(0, Math.floor(r[1]));
      const x1 = Math.min(img.width, Math.ceil(r[2])), y1 = Math.min(img.height, Math.ceil(r[3]));
      const c = new OffscreenCanvas(Math.max(1, Math.round((x1 - x0) * k)), Math.max(1, Math.round((y1 - y0) * k))), x = c.getContext("2d");
      x.imageSmoothingQuality = "high"; x.drawImage(img, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
      return { bmp: c.transferToImageBitmap(), x0, y0, w: c.width, h: c.height };
    });
    const t0 = performance.now();
    const out = await paddle.predict(crops.map(c => c.bmp));
    console.debug(`[buildSim] 辨識引擎：${crops.length} 個區域、${crops.reduce((a, c) => a + c.w * c.h, 0)} 像素，${Math.round(performance.now() - t0)} ms`);
    const mid = (poly, i) => poly.reduce((a, pt) => a + pt[i], 0) / poly.length / k;
    return out.map((r, j) => r.items.map(it => ({ text: it.text.replace(/\s/g, ""), x: crops[j].x0 + mid(it.poly, 0), y: crops[j].y0 + mid(it.poly, 1) }))
      .sort((a, b) => a.x - b.x));
  }
  const padBox = ([x0, y0, x1, y1], f) => { const p = (y1 - y0) * f; return [x0 - p, y0 - p, x1 + p, y1 + p]; };
  // 模型輸出常混用簡體字，名稱比對前先轉成繁體
  const NAME_VARIANT = { 骑: "騎", 钱: "錢", 綫: "錢", 粮: "糧", 库: "庫", 营: "營", 学: "學", 馆: "館", 场: "場", 门: "門", 军: "軍" };
  const autoValue = inp => inp.value === "" || inp.value === inp.dataset.auto;   // 不覆蓋使用者手動改過的值
  // 建築：找得到標籤時只辨識需要確認的牌卡；找不到版面時只辨識左半邊的建築區，以名稱配對

    const img = job.img, got = new Map();

      targets = job.labels;

      const cand = [];
      items.forEach((it, idx) => {
        const m = it.text.match(/(\d{1,2})\/(\d{1,2})/);
        if (!m) return;
        const head = [...it.text.slice(0, m.index)].map(ch => NAME_VARIANT[ch] || ch).join("");
        for (const L of job.labels) {
          const b = builds[L.slot.bid];
          if (+m[1] > b.maxLev) continue;
          const sc = [...b.name].filter(ch => head.includes(ch)).length;
          if (sc) cand.push({ idx, L, sc, lev: +m[1], raw: it.text });
        }
      });
      cand.sort((a, b) => b.sc - a.sc);
      const used = new Set();
      for (const c of cand) if (!got.has(c.L) && !used.has(c.idx)) { got.set(c.L, c); used.add(c.idx); }
    }
    let miss = 0;
    for (const L of targets) {
      const c = got.get(L), inp = L.item.querySelector("input");
      if (c && autoValue(inp)) { inp.value = c.lev; inp.dataset.auto = c.lev; }
      L.needOcr = !c && inp.value === "";
      L.item.classList.toggle("warnc", !c);
      L.item.querySelector(".s").textContent = c ? `辨識「${c.raw}」${L.red ? " · 紅字" : ""}` : "辨識引擎也找不到";
      if (!c) miss++;

    updateHint();
    return miss;
  }
  // 資源：找得到版面時只辨識不確定的數字行；找不到時只辨識左側欄
  // （由上而下為糧草、木材、石料、銅幣，取最後三組「N/小時」與「N萬/上限」）
  const parseRate = t => {
    const m = t.match(/^(\d+)(\/)?/);
    if (!m) return null;
    // 「148320/小時」的斜線常被讀成 1 或 7：沒有斜線又直接接「小時」時去掉最後一位
    return +(!m[2] && /^\d+[小時]/.test(t) && /[17]$/.test(m[1]) ? m[1].slice(0, -1) : m[1]);
  };
  const parseStock = (t, unit) => { const m = t.match(/^(\d+(?:\.\d+)?)(萬?)/); return m ? Math.round(parseFloat(m[1]) * (m[2] ? 10000 : unit || 1)) : null; };
  async function readRes(job) {
    const img = job.img, rows = job.rows, S = {}, R = {};
    let keys = RES;
    if (rows) {
      keys = RES.filter(k => job.lowRes || !(rows[k].rate && rows[k].stock && rows[k].rate.sure && rows[k].stock.sure));
      const rects = [], slots = [];
      for (const k of keys) for (const kind of ["rate", "stock"]) if (rows[k][kind]) { rects.push(padBox(rows[k][kind].box, 0.6)); slots.push([k, kind]); }
      const res = rects.length ? await paddleRead(img, rects) : [];
      slots.forEach(([k, kind], j) => {
        const raw = res[j].map(it => it.text).join("");
        const v = kind === "rate" ? parseRate(raw) : parseStock(raw, rows[k].stock.unit);
        if (v != null) (kind === "rate" ? R : S)[k] = { v, raw };
      });
    } else {
      const [items] = await paddleRead(img, [[0, img.height * 0.1, img.width * 0.35, img.height]]);
      const rates = [], stocks = [];
      for (const it of items.slice().sort((a, b) => a.y - b.y)) {
        if (/^\d+\/?[小時]/.test(it.text)) rates.push({ v: parseRate(it.text), raw: it.text });
        else if (/^\d+(\.\d+)?萬?\//.test(it.text)) stocks.push({ v: parseStock(it.text), raw: it.text });
      }
      if (rates.length >= 3) rates.slice(-3).forEach((r, i) => { R[RES[i]] = r; });

      const item = st.closest(".ocr-item");
      if (!keys.includes(k)) { if (item.classList.contains("warnc")) miss++; continue; }
      for (const [inp, r] of [[st, S[k]], [rt, R[k]]]) if (r && autoValue(inp)) { inp.value = toWan(r.v); inp.dataset.auto = inp.value; }
      const ok = !!(S[k] && R[k]);
      item.classList.toggle("warnc", !ok);
      item.querySelector(".s").textContent = `辨識「${S[k] ? S[k].raw : "?"}」「${R[k] ? R[k].raw : "?"}」${ok ? "" : " · 不確定"}`;
      if (!ok) miss++;

    catch (e) { job.running = false; if (pending === job) status.textContent = "辨識失敗：" + (e.message || e); return; }

  const OCR_GUIDE = {
    build: {
      title: "辨識建築",
      steps: ["在遊戲中點選<b>「建造總覽」</b>。", "把建築列表<b>拖動到最底部</b>（看得到 8 階的民居、錢莊、軍事府）。",
        "截圖後在這裡貼上（Ctrl+V）、拖曳或選擇圖片。"],
      note: "自動辨識各建築等級，只需要確認君主殿等級。",
      img: "build_sim_assets/example_build.webp", caption: "範例：拖動到最底部的建造總覽",
    },
    res: {
      title: "辨識資源",
      steps: ["在遊戲中開啟<b>「資源詳情」</b>畫面（左側列出糧草、木材、石料、銅幣）。",
        "截圖後在這裡貼上（Ctrl+V）、拖曳或選擇圖片。"],
      note: "自動填入木材、石料、銅幣的目前庫存與每小時產量。",

  // ---------- Debug：目前設定與最近一次規劃的逐步計算 ----------
  function debugData() {
    const plan = lastDebugPlan;
    return {
      time: new Date().toISOString(),
      settings: {
        calcMode: state.calcMode, selected: state.selected,
        levels: Object.fromEntries(bids.map(b => [b, { name: builds[b].name, lev: sim.levels[b] }])),
        stock: state.stock, rate: state.rate, priority: state.priority,

  // 主控台指令：buildSim.dump() 取得目前設定與最近一次規劃的 JSON（並嘗試複製到剪貼簿）
  window.buildSim = {
    settings: () => debugData().settings,
    plan: () => debugData().plan,
    dump() {
      const text = JSON.stringify(debugData(), null, 1);
      try { navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
      return text;
    },
    log: () => { logSettings("手動"); logPlan(); },
  };
  function parseClock(s) {
    const m = String(s || "").trim().match(/^(\d+)(?::(\d{1,2}))?(?::(\d{1,2}))?$/);
    if (!m) return null;
    return ((+m[1]) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0))) * 1000;
  }
  function hoardPreview() {
    const lv = Math.max(0, Math.min(15, Math.round(+$("hdLv").value || 0)));
    const union = +$("hdUnion").value || 0;
    $("hdPreview").innerHTML = `每次屯田可得：<b>${fmt(Math.round(RES_GROUND_OUTPUT[lv] * HOARD.hours * (1 + union / 100)))}</b>（木材、石料、銅錢皆同，屯田前轉換資源點類型即可）
      <br><span style="color:var(--muted)">＝ 資源點每小時產量 × 24 小時 × (1 + 聯盟科技屯田加成)。屯田令上限 10 個，每 3 小時恢復 1 個。</span>`;
  }
  $("hoardOpen").addEventListener("click", () => {
    const h = state.hoard, cur = hoardNow();
    $("hdCount").value = cur ? cur.count : "";
    $("hdNext").value = cur && cur.next != null ? fmtClock(cur.next - Date.now()) : "";
    $("hdNext").dataset.orig = $("hdNext").value;   // 未修改時儲存會沿用原本精確的恢復時間戳
    $("hdCount").dataset.orig = $("hdCount").value;
    $("hdBuy").checked = !!h.buy;
    $("hdBought").checked = h.boughtDay === dayIndex(Date.now());
    $("hdLv").value = h.lv || 0;
    $("hdUnion").value = h.union || 0;
    hoardPreview();
    $("hoardDlg").showModal();
  });
  $("hoardDlg").addEventListener("input", hoardPreview);
  $("hdClose").addEventListener("click", () => $("hoardDlg").close());
  $("hdSave").addEventListener("click", () => {
    const now = Date.now(), h = state.hoard;
    const cnt = $("hdCount").value === "" ? null : Math.max(0, Math.min(HOARD.cap, Math.round(+$("hdCount").value)));
    const rem = parseClock($("hdNext").value), cur = hoardNow(now);
    // 恢復時間沿用絕對時間戳：欄位未修改就保留原值（避免每次儲存都因四捨五入而提早）
    const keepNext = cur && cur.next != null && $("hdNext").value === $("hdNext").dataset.orig;
    h.count = cnt; h.at = now;
    h.nextAt = cnt == null || cnt >= HOARD.cap ? null
      : keepNext ? cur.next
      : now + (rem != null ? Math.min(rem, HOARD.recoverMs) : HOARD.recoverMs);
    h.buy = $("hdBuy").checked;
    h.boughtDay = $("hdBought").checked ? dayIndex(now) : null;
    h.lv = Math.max(0, Math.min(15, Math.round(+$("hdLv").value || 0)));
    h.union = Math.max(0, +$("hdUnion").value || 0);
    save(); renderHoardChip(); $("hoardDlg").close();
    if (!$("planBox").hidden && lastPlanArgs) runPlan(...lastPlanArgs);
  });
  renderHoardChip();
  setInterval(() => {
    renderHoardChip();
    if (settleStock()) { save(); refreshEconomy(); }
  }, 1000);
  logSettings("載入");
  console.log("%c[建築模擬器] 主控台指令：buildSim.dump()、buildSim.settings()、buildSim.plan()、buildSim.log()", LOG_STYLE);
  window.__buildSim = { runOcr, locateGrid, engine, debugData, shareUrl, packShare, unpackShare, sharePayload };

  render();
  checkShareLink();
})();
</script>
</body>
</html>
